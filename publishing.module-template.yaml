# Publishing, shared by every module under `libs/`.
#
# The toolchain's docs recommend a template over repeating this block, and warn why it has to be on
# *every* published module: a published module's local dependencies must be published too, or its
# POM names coordinates that do not exist. `stx-ktor` depends on `stx-common`, `stx-mongo` on
# `stx-common`, and so on — so this is applied to all of them, `stx-testing` included.
#
# Publishing is a preview feature of the toolchain and is documented as likely to change.

settings:
  publishing:
    enabled: true
    group: io.github.softistx
    # Written by `scripts/sync-version.ts` from package.json. Do not edit it by hand: the same
    # version lives in `libs.versions.toml` as `stx = "…"`, and the two must move together or every
    # example resolves a coordinate nobody published. `docs/releasing.md` has the circuit.
    version: 0.1.0
    # `artifactId` is deliberately absent: it defaults to the module's name, so the directory name
    # *is* the artifact name and there is no second place to keep in sync.

    # A sources jar per platform. Maven Central requires one, and it is what makes a consumer's IDE
    # show why a function is shaped the way it is rather than a decompiled signature.
    publishSources: true

    # Maven Central and artifact signing are NOT enabled here. `scripts/enable-central.ts` adds
    # them in the release job and the change is never committed, because the two settings are
    # coupled and every committed combination breaks someone — both measured:
    #
    #   signArtifacts: true    →  `./kotlin publish mavenLocal` fails without
    #                             KOTLIN_TOOLCHAIN_SIGNING_KEY, and that local publish is what every
    #                             contributor does on every change under libs/. (build/test are fine.)
    #   signArtifacts: false   →  the toolchain refuses the project at model-load time — "Maven
    #      + mavenCentral         Central requires artifact signatures" — so even `./kotlin build`
    #                             fails, for everyone.
    #
    # Committing neither breaks no one.

    # `name` defaults to the module's name and `description` to the module's own `description:` key,
    # which every library here has — so neither is repeated. The rest is the metadata Maven Central
    # will require of every artifact. Unlike signing, none of it breaks anything locally, so it is
    # committed rather than injected.
    pom:
      url: https://github.com/softistx/nxgt-krepo
      # Shorthand for pom.scm.url; connection and developerConnection derive as `scm:git:$url`.
      scm: https://github.com/softistx/nxgt-krepo.git
      licenses:
        - name: Apache-2.0
          url: https://www.apache.org/licenses/LICENSE-2.0
      developers:
        - name: Steve Tsala
          url: https://github.com/SteveGT96

# `mavenCentral` is a built-in repository id and needs no entry here — it is reached through
# `settings.publishing.mavenCentral`, with credentials taken from the environment. This list is the
# local loop only: publish to mavenLocal in the same change that touches a library, so an example
# builds against what you just wrote rather than against a stale artifact.
repositories:
  - url: mavenLocal
    publish: true
