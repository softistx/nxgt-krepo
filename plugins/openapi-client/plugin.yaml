tasks:
  generate:
    action: !dev.nxgt.openapi.plugin.generateClient
      specFile: ${module.rootDir}/${pluginSettings.specFile}
      outputDir: ${taskOutputDir}
      packageName: ${pluginSettings.packageName}
      client: ${pluginSettings.client}
      groupBy: ${pluginSettings.groupBy}
      generateModels: ${pluginSettings.generateModels}

generated:
  sources:
    - language: kotlin
      directory: ${tasks.generate.action.outputDir}
