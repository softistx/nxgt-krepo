product: jvm/lib

dependencies:
  - $libs.swagger.parser
  # FileSpec appears in ClientEmitter's signature, so KotlinPoet is part of this
  # module's public API and must be visible to modules that compile against it
  - $libs.kotlinpoet: exported

test-dependencies:
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
