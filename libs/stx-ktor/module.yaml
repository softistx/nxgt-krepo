product: jvm/lib
description: Ktor integrations for the stx libraries — one package per integration, one module for all of them

apply:
  - //publishing.module-template.yaml

dependencies:
  # One entry per integration, and every one of them compile-only.
  #
  # These are exposed by this module's API — `call.redis` returns a `Redis` — and they still do not
  # belong on a consumer's runtime classpath. An application that installs RedisConnection already
  # depends on stx-redis, because RedisConfig is the only way to configure the plugin at all; and
  # an application that installs only I18n never loads a class from any of the others, so
  # nothing is missing at runtime. That is what keeps one module from handing every app every driver.
  #
  # Verified with `./kotlin show dependencies -m stx-ktor`: a compile-only entry is in the COMPILE
  # scope and absent from RUNTIME.
  - //libs/stx-i18n/stx-i18n: compile-only
  - //libs/stx-redis/stx-redis: compile-only
  - //libs/stx-mongo/stx-mongo: compile-only
  - //libs/stx-amqp/stx-amqp: compile-only
  - //libs/stx-kafka/stx-kafka: compile-only
  - //libs/stx-storage/stx-storage: compile-only
  - //libs/stx-jpa/stx-jpa: compile-only

  # `CorsPolicy` is what `cors(policy)` takes, so a caller has to see it.
  - //libs/stx-common: exported

  # ApplicationCall and the plugin API are all over this module's public surface
  - $ktor.server.core: exported

  # Ktor's CORS plugin, for `com.softistx.ktor.cors` alone and on the same terms as the libraries
  # above: an application that never calls `cors(policy)` never loads a class from it.
  - $ktor.server.cors: compile-only


  # Ktor's DI, for the registrations in `com.softistx.ktor.di`. Compile-only for the same reason:
  # an application that never calls `provideRedis` never loads a class from it.
  - $libs.ktor.server.di: compile-only

test-dependencies:
  # the specs run the plugins for real, so here the libraries are on the runtime classpath too
  - //libs/stx-i18n/stx-i18n
  - //libs/stx-redis/stx-redis
  - //libs/stx-mongo/stx-mongo
  - //libs/stx-amqp/stx-amqp
  - //libs/stx-kafka/stx-kafka
  - //libs/stx-storage/stx-storage
  - //libs/stx-jpa/stx-jpa
  # and the servers they connect to, started for the run
  - //libs/stx-testing

  # the JpaConnection spec creates and drops its own schema with the Postgres client directly;
  # stx-jpa keeps its three drivers runtime-only, so nothing inherits a compile classpath for one
  - $libs.vertx.pg.client
  - $libs.ktor.server.di
  - $ktor.server.cors
  - $ktor.server.testHost
  - $ktor.server.netty
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  kotlin:
    # For the documents the Mongo spec round-trips. Nothing in `src/` is @Serializable — as with
    # noArg/allOpen below, this is the block an application needs in its own module.yaml when the
    # types it hands a plugin are serializable.
    serialization: json
    # For the entity the JpaConnection spec maps. Every module that *holds* entities needs these two
    # — this one holds exactly one, in its test sources, and an application installing the plugin
    # will need the same block in its own module.yaml. Nothing in `src/` carries a JPA annotation, so
    # neither plugin has anything to do there.
    noArg:
      enabled: true
      presets: [ jpa ]
    allOpen:
      enabled: true
      annotations:
        - jakarta.persistence.Entity
        - jakarta.persistence.MappedSuperclass
        - jakarta.persistence.Embeddable

  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence. `$ktor.*` and a `$libs.*` alias on `version.ref = "ktor"`
    # have to be one version, or a toolchain upgrade splits them silently.
    version: 3.5.2
