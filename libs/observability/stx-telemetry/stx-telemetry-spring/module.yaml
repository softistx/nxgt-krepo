product: jvm/lib
description: "Spring Boot auto-configuration for stx-telemetry, opt-in behind stx.telemetry, with a CoWebFilter that makes each request a server span"

apply:
  - //libs/observability/stx-telemetry/stx-telemetry.module-template.yaml

dependencies:
  # Telemetry is the bean this module registers, so it is in its API
  - //libs/observability/stx-telemetry/stx-telemetry: exported
  # The exporter stx.telemetry.otlp builds. Compile-only for the same reason stx-workflow-spring's
  # stores are: an application that turns it on already depends on the module, and one that does not
  # loads a class from none of it — @ConditionalOnClass is what keeps the configuration readable.
  - //libs/observability/stx-telemetry/stx-telemetry-otlp: compile-only
  # The exporter stx.telemetry.slf4j builds — the bridge pointed outward, for an application that
  # already has logback. Compile-only for the same reason, and note the module also ships an
  # SLF4JServiceProvider that points the bridge the other way: adding it here would decide an
  # application's SLF4J binding for it, which is not this module's business.
  - //libs/observability/stx-telemetry/stx-telemetry-slf4j: compile-only
  # The exporter stx.telemetry.mongo builds, on the same rule. It brings the Mongo coroutine driver
  # with it, which is the clearest case yet for compile-only: an application with no telemetry in a
  # database must not carry a driver because this module knows how to use one.
  - //libs/observability/stx-telemetry/stx-telemetry-mongo: compile-only
  # WebFilter and CoWebFilter — the server span lives in the reactive filter chain
  - $spring.boot.starter.webflux: exported
  # Spring binds Kotlin configuration properties through the primary constructor only when reflect
  # is present — the same line every Spring module here carries
  - $libs.kotlin.reflect
  # `CoWebFilter` is implemented with `mono { }`, so it does not work without this — and the webflux
  # starter does not bring it. Found by a spec that hung rather than by reading a manifest: every
  # filter scenario, including the one that only calls `chain.filter`, timed out until this was here.
  - $libs.kotlinx.coroutines.reactor

test-dependencies:
  - //libs/observability/stx-telemetry/stx-telemetry-otlp
  # Brings the Slf4jExporter class the wiring spec asks the context for — and, unavoidably, the
  # provider that binds SLF4J to this pipeline, which is why $libs.slf4j.nop is not here beside it:
  # two providers on one classpath is a binding decided by jar order, and the spec that checks the
  # loop is refused would then pass or fail by luck.
  - //libs/observability/stx-telemetry/stx-telemetry-slf4j
  # The wiring spec asks the context for a MongoExporter. It needs no server: the exporter opens its
  # client lazily and touches it on the first batch, which this spec never sends.
  - //libs/observability/stx-telemetry/stx-telemetry-mongo
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  springBoot: enabled
  kotlin:
    serialization: json
