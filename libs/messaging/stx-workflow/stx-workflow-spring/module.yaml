product: jvm/lib
description: "Spring Boot auto-configuration for stx-workflow, opt-in behind stx.workflow"

apply:
  - //libs/messaging/stx-workflow/stx-workflow.module-template.yaml

dependencies:
  # WorkflowEngine is the bean this module registers, so it is in its API
  - //libs/messaging/stx-workflow/stx-workflow: exported
  # The three stores stx.workflow.store can name. Compile-only, and the same reasoning as
  # stx-workflow-db's own manifest: a store cannot be constructed without the library that provides
  # its connection, so an application that names one already depends on it, and one that names none
  # loads a class from none of them. @ConditionalOnClass is what keeps the configuration readable
  # when they are absent.
  - //libs/messaging/stx-workflow/stx-workflow-db: compile-only
  - //libs/data/stx-redis/stx-redis: compile-only
  - //libs/data/stx-jpa/stx-jpa: compile-only
  - //libs/data/stx-mongo/stx-mongo: compile-only
  # spring-context and spring-boot-autoconfigure, which is all this module touches — there is no
  # HTTP surface here, so the webflux starter stx-spring-boot needs would be weight for nothing.
  - $spring.boot.starter: exported
  # Spring binds Kotlin configuration properties through the primary constructor only when reflect
  # is present — the same line stx-spring-boot carries, for the same reason.
  - $libs.kotlin.reflect

test-dependencies:
  # the wiring specs stand the stores up for real, so here they are on the runtime classpath
  - //libs/messaging/stx-workflow/stx-workflow-db
  - //libs/data/stx-redis/stx-redis
  - //libs/core/stx-testing
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  springBoot: enabled
  kotlin:
    # A workflow context is @Serializable by definition, and the specs declare one
    serialization: json
