product: jvm/lib
description: "Ktor plugin for stx-workflow: one engine per application, and the worker on its scope"

apply:
  - //publishing.module-template.yaml

dependencies:
  # WorkflowEngine is what the plugin publishes and what call.workflows returns
  - //libs/messaging/stx-workflow/stx-workflow: exported
  - $ktor.server.core: exported
  # `own`, `publish` and `required` — the resource-lifecycle idiom every plugin in this repo shares.
  # It stays in stx-ktor because it belongs to no integration; this module is a caller of it.
  - //libs/core/stx-ktor
  # Ktor DI. Installing the plugin registers the engine with the container, so this is on the
  # runtime classpath of every application that installs it — and exported, because resolving what
  # was registered is the point.
  - $libs.ktor.server.di: exported

test-dependencies:
  - //libs/messaging/stx-workflow/stx-workflow-db
  - //libs/data/stx-redis/stx-redis
  - //libs/core/stx-testing
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    version: 3.5.2
  kotlin:
    # A consumer installing this plugin needs the same block: a workflow context is @Serializable
    # by definition, and the specs here declare one.
    serialization: json
