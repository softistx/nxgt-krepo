product: jvm/lib
description: "Compensable workflows in Kotlin: a DSL of steps, a compensation per step, and state checkpointed after each one"

apply:
  - //publishing.module-template.yaml

dependencies:
  # the shared lenient Json a persisted context is read back through, and CloseGuard
  - //libs/core/stx-common: exported
  # the context, the journal and the instance record are all @Serializable, and KSerializer<C>
  # is in the signature of workflow<C>()
  - $libs.kotlinx.serialization: exported
  # a step suspends; withTimeout, coroutineScope and Deferred are in the engine and in its API
  - $libs.kotlinx.coroutines.core: exported
  # An annotated class is read reflectively when `workflowOf` turns it into a Workflow. Not
  # exported: an application writes the annotations this module defines and never touches a
  # KFunction, exactly as in stx-graphix.
  - $libs.kotlin.reflect

test-dependencies:
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  kotlin:
    serialization: json
