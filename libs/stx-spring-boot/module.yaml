product: jvm/lib
description: "Spring Boot integration for the stx libraries: WebFlux helpers, Spring Data Mongo, and one auto-configuration per library"

apply:
  - //publishing.module-template.yaml

dependencies:
  # `Messages` is a constructor parameter of the exception handler and `Translator` is what its
  # extensions return, so a consumer has to see both to build or call either.
  - //libs/stx-i18n: exported

  # `Page` and `PageInfo` are what `Page<T>.response()` takes and what its envelope carries, and
  # `CorsPolicy` is what `stx.cors` becomes — the same type stx-ktor installs Ktor's plugin from.
  - //libs/stx-common: exported

  # The libraries `integration/` wires, every one compile-only for the reason spelled out below —
  # and local modules first, before any alias, as AGENTS.md's *Module layout* requires.
  - //libs/stx-mongo: compile-only
  - //libs/stx-jpa: compile-only
  - //libs/stx-storage: compile-only
  - //libs/stx-redis: compile-only
  - //libs/stx-kafka: compile-only
  - //libs/stx-amqp: compile-only
  - //libs/stx-workflow/stx-workflow: compile-only
  # The three stores, for the WorkflowStore the workflow auto-configuration builds over whichever
  # connection stx.workflow.store names.
  - //libs/stx-workflow/stx-workflow-db: compile-only

  # ServerWebExchange, ServerRequest and ServerResponse are all over this module's public API.
  # The starter also brings spring-context and spring-boot-autoconfigure, which every package here
  # needs, so there is nothing finer to depend on.
  - $spring.boot.starter.webflux: exported

  # Spring binds `@ConfigurationProperties` through the primary constructor, and it only takes that
  # path when `KotlinDetector.isKotlinReflectPresent()` — without this, a Kotlin data class holding
  # properties binds through setters it does not have. Not transitive from any starter here.
  - $libs.kotlin.reflect

  # kotlinx-coroutines-reactor, for `mono { }` and the Reactor-specific awaits in `client/`.
  # `kotlinx-coroutines-reactive` — which the webflux starter does not bring either — covers
  # `Publisher`, and the two are separate artifacts with overlapping names: `awaitSingleOrNull` on a
  # `Mono` is the Reactor one, `awaitFirstOrNull` on a `Publisher` is the other. Reactor brings
  # reactive transitively, so one entry covers both.
  #
  # `exported`, and not as a convenience: `body<T>()`, `existsBy<T>()` and `findAsFlow<T>()` are
  # `inline`, so their bodies — and the `awaitSingle`/`asFlow` calls in them — are compiled into the
  # *caller*. A consumer without this on its own classpath fails to compile the moment it uses one,
  # which is what `examples/spring-orders` did before this line said `exported`.
  - $libs.kotlinx.coroutines.reactor: exported

  # One entry per optional integration, and every one of them compile-only — the same rule and the
  # same reason as stx-ktor. A package guarded by `@ConditionalOnClass` is dark until the application
  # adds that library itself, so nothing here hands every consumer every dependency. Verified with
  # `./kotlin show dependencies -m stx-spring-boot`: these sit in COMPILE and are absent from
  # RUNTIME.

  # Jakarta Validation, for `ValidationExceptionHandler` and `web/Validation.kt`. Also the reason
  # that handler is its own class: a `@RestControllerAdvice` naming a missing class cannot be loaded.
  - $spring.boot.starter.validation: compile-only

  # Spring Security, for `security/` alone. An application that never authenticates anyone does not
  # load `currentUser` or the ownership annotations, and so does not carry the jars behind them.
  - $spring.boot.starter.security: compile-only

  # Spring Data Reactive Mongo, for `data/mongo/` alone. The heaviest of the three — the
  # driver, the mapping context and spring-data-commons — and an application talking to Postgres has
  # no reason to carry any of it.
  - $spring.boot.starter.data.mongodb.reactive: compile-only

  # Object diffing, for the Mongo audit trail alone: it compares the previous stored state with the
  # one just saved and reports the changed properties, which is the whole reason that trail is more
  # than a copy of the document.
  - $libs.javers.core: compile-only

  # What `src/testing/` is built from, and every one of them compile-only for the same reason as the
  # integrations above: `com.strange.spring.testing` is a package an *application's test* classpath
  # lights up. Nothing in `src/` refers to it and no auto-configuration imports it, so a production
  # consumer never loads a class it has no jar for. Verified with
  # `./kotlin show dependencies -m stx-spring-boot`: these sit in COMPILE and are absent from RUNTIME.

  # mongoContainer(), which is where the URI in `MongoTestConfiguration` comes from. Declared in
  # stx-testing's `Backends.kt`, never in this tree.
  - //libs/stx-testing: compile-only

  # @TestConfiguration, @SpringBootTest, @ActiveProfiles and WebTestClient.
  - $spring.boot.starter.test: compile-only

  # FeatureSpec, for the base specs, and AbstractProjectConfig, for the Kotest bootstrap.
  - $libs.kotest.framework.engine: compile-only
  # `eventually` and `shouldBe`, for the migration gate.
  - $libs.kotest.assertions.core: compile-only
  # SpringExtension — what makes @SpringBootTest mean anything to a Kotest spec.
  - $libs.kotest.extensions.spring: compile-only

test-dependencies:
  # The MongoDB the findPage specs page through: `MONGO_TEST_URI` when the workspace's replica set
  # is already up, a container started once for the run otherwise, and the specs report skipped when
  # neither is there. Declared in stx-testing's `Backends.kt`, never in this tree.
  - //libs/stx-testing

  # The specs run the auto-configuration for real, so the compile-only libraries above are on the
  # runtime classpath here too — otherwise `@ConditionalOnClass` skips what they came to check.
  # This is not a formality: the first run of ErrorAutoConfigurationTest found no
  # ValidationExceptionHandler, and the security specs failed with NoClassDefFoundError — which is
  # exactly what a consumer without those libraries sees.
  - $spring.boot.starter.validation
  - $spring.boot.starter.security
  - $spring.boot.starter.data.mongodb.reactive
  - $libs.javers.core

  # And the stx libraries the integration specs stand up for real, for the same reason.
  - //libs/stx-mongo
  - //libs/stx-jpa
  - //libs/stx-storage
  - //libs/stx-redis
  - //libs/stx-workflow/stx-workflow
  - //libs/stx-workflow/stx-workflow-db
  - //libs/stx-kafka
  - //libs/stx-amqp
  # ApplicationContextRunner, for asserting what does and does not appear in a context
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  # `src/testing/` is compile-only above, which keeps it off this module's *test* runtime as well —
  # so the specs that exercise the base specs need the extension back at normal scope.
  - $libs.kotest.extensions.spring

settings:
  # Applies the Spring Boot BOM (4.1.0), the all-open and no-arg compiler plugins with the `spring`
  # and `jpa` presets, and `-java-parameters` — so every Spring dependency below is unversioned and
  # a @Configuration class does not have to be written `open`.
  springBoot: enabled
  kotlin:
    serialization: json
