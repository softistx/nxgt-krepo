product: jvm/lib
description: "Spring Boot auto-configuration for stx-redis, opt-in behind stx.redis"

apply:
  - //publishing.module-template.yaml

dependencies:
  # Redis is the bean this module registers and RedisConfig is what it is built from. Exported,
  # where the hub had it compile-only: a consumer of this module cannot use the auto-configuration
  # without the library. It was optional in stx-spring-boot because six sibling integrations were.
  - //libs/stx-redis/stx-redis: exported
  # spring-context and spring-boot-autoconfigure, which is all this module touches — there is no
  # HTTP surface here.
  - $spring.boot.starter: exported
  # Spring binds Kotlin configuration properties through the primary constructor only when reflect
  # is present — the same line stx-spring-boot and stx-workflow-spring carry.
  - $libs.kotlin.reflect

test-dependencies:
  # the server the wiring spec opens a connection against, started for the run when the workspace's
  # own is not named
  - //libs/stx-testing
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  springBoot: enabled
  kotlin:
    # ConfigurationMetadataTest and ConfigurationDocsTest read the metadata JSON with kotlinx
    serialization: json
