product: jvm/lib
description: "Ktor plugin for stx-mongo: one client per application and one database handle over it, closed when it stops"

apply:
  - //publishing.module-template.yaml

dependencies:
  # `mongoClient` is what the plugin calls, MongoClient and MongoDatabase are what `call.mongo` and
  # `call.database` return. Exported, not compile-only: a consumer of this module cannot install the
  # plugin without them. The hub this came out of had it optional because six other integrations
  # were, which is a fact about the hub and not about this integration.
  - //libs/data/stx-mongo/stx-mongo: exported
  - $ktor.server.core: exported

  # `publish`, `resource` and `required` — the resource-lifecycle idiom every plugin in this repo
  # shares. It stays in stx-ktor because it belongs to no integration; this module is a caller.
  - //libs/core/stx-ktor

  # Ktor DI. Installing the plugin registers the client and the database with the container, so this
  # is on the runtime classpath of every application that installs it — and exported, because
  # resolving what was registered is the point.
  - $libs.ktor.server.di: exported

test-dependencies:
  # the replica set the spec talks to, started for the run when the workspace's own is not named
  - //libs/core/stx-testing
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  kotlin:
    # For the document the spec round-trips. Nothing in `src/` is @Serializable: this is the block an
    # application needs in its own module.yaml when the types it stores are.
    serialization: json
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence.
    version: 3.5.2
