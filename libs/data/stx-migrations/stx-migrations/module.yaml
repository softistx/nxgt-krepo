product: jvm/lib
description: "Schema migrations written in Kotlin: a version, a ledger and a lock, with no store in this module"

apply:
  - //libs/data/stx-migrations/stx-migrations.module-template.yaml

dependencies:
  # CoroutineSafeMap, behind InMemoryLedger. Lease is not used here — an in-process holder is a live
  # coroutine and has no crash to expire — but it is what the ledgers in stx-migrations-db run.
  - //libs/core/stx-common
  # A migration suspends, and the runner delays between attempts on the lock. Exported because
  # `Migration.migrate` is a suspending function every consumer implements.
  - $libs.kotlinx.coroutines.core: exported

test-dependencies:
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
