product: jvm/lib
description: AMQP over the RabbitMQ client, made suspending — publishing, consuming, and the confirm and ack rules

apply:
  - //publishing.module-template.yaml

dependencies:
  # the shared Json every body is read through, and the decode over it
  - //libs/stx-common

  # Connection, Channel, AMQP.BasicProperties and Envelope are all over this module's public API
  - $libs.amqp.client: exported
  - $libs.kotlinx.coroutines.core: exported
  # message bodies are carried as their kotlinx.serialization form
  - $libs.kotlinx.serialization: exported

test-dependencies:
  # the broker the integration specs talk to, started for the run when the workspace's own is not
  # named — test-only, so nothing here reaches a consumer of this library
  - //libs/stx-testing
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  # the RabbitMQ client logs through SLF4J; a no-op provider keeps the test output readable
  - $libs.slf4j.nop

settings:
  kotlin:
    serialization: json
