product: jvm/lib
description: "Ktor plugin for stx-i18n: one negotiated locale per request, resolved once at call setup"

apply:
  - //publishing.module-template.yaml

dependencies:
  # Messages is what the plugin is installed with and Translator is what `call.translator` returns.
  # Exported, where the hub had it compile-only: a consumer of this module cannot install the plugin
  # without the library.
  - //libs/stx-i18n/stx-i18n: exported
  - $ktor.server.core: exported

  # `publish` and `required` — the resource-lifecycle idiom every plugin in this repo shares. It
  # stays in stx-ktor because it belongs to no integration; this module is a caller of it.
  - //libs/stx-ktor

  # Ktor DI, for `injectable = true`. Compile-only so an application that never sets it never loads
  # a class from it — the same rule as stx-ktor and stx-workflow-ktor.
  - $libs.ktor.server.di: compile-only

test-dependencies:
  # No container and no server of its own: the catalogs are built in the spec and what is being
  # checked is which locale a request is answered in.
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence.
    version: 3.5.2
