product: jvm/lib
description: "Spring Boot integration for the stx libraries: WebFlux helpers, Spring Data Mongo, and one auto-configuration per library"

apply:
  - //publishing.module-template.yaml

dependencies:
  # `Messages` is a constructor parameter of the exception handler and `Translator` is what its
  # extensions return, so a consumer has to see both to build or call either.
  - //libs/stx-i18n: exported

  # `Page` and `PageInfo` are what `Page<T>.response()` takes and what its envelope carries, and
  # `CorsPolicy` is what `stx.cors` becomes — the same type stx-ktor installs Ktor's plugin from.
  - //libs/stx-common: exported

  # ServerWebExchange, ServerRequest and ServerResponse are all over this module's public API.
  # The starter also brings spring-context and spring-boot-autoconfigure, which every package here
  # needs, so there is nothing finer to depend on.
  - $spring.boot.starter.webflux: exported

  # Spring binds `@ConfigurationProperties` through the primary constructor, and it only takes that
  # path when `KotlinDetector.isKotlinReflectPresent()` — without this, a Kotlin data class holding
  # properties binds through setters it does not have. Not transitive from any starter here.
  - $libs.kotlin.reflect

  # kotlinx-coroutines-reactor, for `mono { }` and the Reactor-specific awaits in `client/`.
  # `kotlinx-coroutines-reactive` — which the webflux starter does not bring either — covers
  # `Publisher`, and the two are separate artifacts with overlapping names: `awaitSingleOrNull` on a
  # `Mono` is the Reactor one, `awaitFirstOrNull` on a `Publisher` is the other.
  - $libs.kotlinx.coroutines.reactor

  # One entry per optional integration, and every one of them compile-only — the same rule and the
  # same reason as stx-ktor. A package guarded by `@ConditionalOnClass` is dark until the application
  # adds that library itself, so nothing here hands every consumer every dependency. Verified with
  # `./kotlin show dependencies -m stx-spring`: these sit in COMPILE and are absent from RUNTIME.

  # Jakarta Validation, for `ValidationExceptionHandler` and `web/Validation.kt`. Also the reason
  # that handler is its own class: a `@RestControllerAdvice` naming a missing class cannot be loaded.
  - $spring.boot.starter.validation: compile-only

  # Spring Security, for `security/` alone. An application that never authenticates anyone does not
  # load `currentUser` or the ownership annotations, and so does not carry the jars behind them.
  - $spring.boot.starter.security: compile-only

  # Spring Data Reactive Mongo, for `data/mongo/` alone. The heaviest of the three — the
  # driver, the mapping context and spring-data-commons — and an application talking to Postgres has
  # no reason to carry any of it.
  - $spring.boot.starter.data.mongodb.reactive: compile-only

test-dependencies:
  # The specs run the auto-configuration for real, so the compile-only libraries above are on the
  # runtime classpath here too — otherwise `@ConditionalOnClass` skips what they came to check.
  # This is not a formality: the first run of ErrorAutoConfigurationTest found no
  # ValidationExceptionHandler, and the security specs failed with NoClassDefFoundError — which is
  # exactly what a consumer without those libraries sees.
  - $spring.boot.starter.validation
  - $spring.boot.starter.security
  - $spring.boot.starter.data.mongodb.reactive
  # ApplicationContextRunner, for asserting what does and does not appear in a context
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  # Applies the Spring Boot BOM (4.1.0), the all-open and no-arg compiler plugins with the `spring`
  # and `jpa` presets, and `-java-parameters` — so every Spring dependency below is unversioned and
  # a @Configuration class does not have to be written `open`.
  springBoot: enabled
  kotlin:
    serialization: json
