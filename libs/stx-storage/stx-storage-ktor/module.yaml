product: jvm/lib
description: "Ktor plugin for stx-storage: one object-storage client per application, opened with it and closed with it"

apply:
  - //publishing.module-template.yaml

dependencies:
  # ObjectStorage is what the plugin opens and what `call.storage` returns, and StorageConfig is the
  # only way to configure it. Exported, where the hub had it compile-only: a consumer of this module
  # cannot install the plugin without the library.
  - //libs/stx-storage/stx-storage: exported
  - $ktor.server.core: exported

  # `resource` and `required` — the resource-lifecycle idiom every plugin in this repo shares. It
  # stays in stx-ktor because it belongs to no integration; this module is a caller of it.
  - //libs/stx-ktor

  # Ktor DI. Installing the plugin registers the client with the container, so this is on the
  # runtime classpath of every application that installs it — and exported, because resolving what
  # was registered is the point.
  - $libs.ktor.server.di: exported

test-dependencies:
  # the MinIO the spec talks to, started for the run when the workspace's own is not named
  - //libs/stx-testing
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence.
    version: 3.5.2
