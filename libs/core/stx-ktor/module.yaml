product: jvm/lib
description: The Ktor foundation the stx plugins are built on — the resource-lifecycle idiom, and one CORS policy shared with Spring

apply:
  - //publishing.module-template.yaml

dependencies:
  # `CorsPolicy` is what `cors(policy)` takes, so a caller has to see it.
  - //libs/core/stx-common: exported

  # ApplicationCall and the plugin API are all over this module's public surface
  - $ktor.server.core: exported

  # Ktor's CORS plugin, for `com.softistx.ktor.cors` alone: an application that never calls
  # `cors(policy)` never loads a class from it.
  - $ktor.server.cors: compile-only

  # Ktor's DI, named here for what `DependenciesTest` pins about it — that the container closes
  # every AutoCloseable it hands out, which is the fact `own` and `publish` are split over. Nothing
  # in `src/` imports it, and it is compile-only for the same reason as the line above.
  - $libs.ktor.server.di: compile-only

test-dependencies:
  # No backend anywhere in this module's specs, and that is the point of what is left in it: the
  # DI facts are checked with a `Probe`, and CORS with a real server and no service behind it. A
  # plugin against a real Redis or a real broker is that integration's own module's spec.
  - $libs.ktor.server.di
  - $ktor.server.cors
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence. `$ktor.*` and a `$libs.*` alias on `version.ref = "ktor"`
    # have to be one version, or a toolchain upgrade splits them silently.
    version: 3.5.2
