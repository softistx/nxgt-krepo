# Coercion errors for the built-in scalars. Keys are com.softistx.graphix.message.MessageKeys.
# Arguments are {named}: a translator may reorder them, and {0} would not survive that.
stx.graphix.messages.scalar.serialize = {scalar} cannot serialize a value of type {actual}
stx.graphix.messages.scalar.parseValue = {scalar} cannot read a value of type {actual}
stx.graphix.messages.scalar.parseLiteral = {scalar} expected {expected}, got {actual}
stx.graphix.messages.scalar.parse = {scalar} cannot parse '{value}'
stx.graphix.messages.scalar.parseReason = {scalar} cannot parse '{value}': {reason}
stx.graphix.messages.scalar.range = {scalar} expects {constraint}, got {value}

stx.graphix.messages.literal.string = a string literal
stx.graphix.messages.literal.int = an integer literal
stx.graphix.messages.literal.float = a numeric literal
stx.graphix.messages.literal.boolean = a boolean literal
stx.graphix.messages.literal.enum = an enum literal
stx.graphix.messages.literal.object = an object literal
stx.graphix.messages.literal.list = a list literal
stx.graphix.messages.literal.null = a null literal

stx.graphix.messages.range.positive = a value greater than zero
stx.graphix.messages.range.negative = a value less than zero
stx.graphix.messages.range.nonPositive = a value of zero or less
stx.graphix.messages.range.nonNegative = a value of zero or more
stx.graphix.messages.range.between = a value between {min} and {max}
