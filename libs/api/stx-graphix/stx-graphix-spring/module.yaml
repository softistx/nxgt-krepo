product: jvm/lib
description: "Spring Boot auto-configuration for stx-graphix, opt-in behind stx.graphix"

apply:
  - //publishing.module-template.yaml

dependencies:
  - //libs/api/stx-graphix/stx-graphix: exported
  # RouterFunction and WebFlux types are the HTTP surface this module exposes
  - $spring.boot.starter.webflux: exported
  # `mono { }` and `bodyValueAndAwait` compile into the caller
  - $libs.kotlinx.coroutines.reactor: exported
  # `Publisher.asFlow` for the graphql-ws socket. reactor is the HTTP bridge; this is the stream.
  - $libs.kotlinx.coroutines.reactive
  # Spring binds Kotlin configuration properties through the primary constructor only when reflect
  # is present — the same line stx-spring-boot carries, for the same reason.
  - $libs.kotlin.reflect

test-dependencies:
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  springBoot: enabled
  kotlin:
    serialization: json
