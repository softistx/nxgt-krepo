product: jvm/lib
description: "Koin collection for stx-graphix: resolvers, scalars, directives, customizers and interceptors as singles"

apply:
  - //libs/api/stx-graphix/stx-graphix.module-template.yaml

dependencies:
  - //libs/api/stx-graphix/stx-graphix: exported
  # `Koin.getAll<T>()` is the whole point of this module, and `GraphixResolver` is implemented by
  # the caller's own classes — both are in its public surface.
  - $libs.koin.core: exported

test-dependencies:
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop
