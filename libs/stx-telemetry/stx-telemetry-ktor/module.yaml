product: jvm/lib
description: "Ktor plugin for stx-telemetry: one telemetry per application, and a server span per request that continues the incoming traceparent"

apply:
  - //publishing.module-template.yaml

dependencies:
  # Telemetry is what the plugin publishes and what call.telemetry returns
  - //libs/stx-telemetry/stx-telemetry: exported
  - $ktor.server.core: exported
  # `resource`, `publish` and `required` — the lifecycle idiom every plugin in this repo shares
  - //libs/stx-ktor
  # Ktor DI, for `injectable = true`. Compile-only so an application that never sets it never loads
  # a class from it — the same rule as stx-ktor and stx-workflow-ktor.
  - $libs.ktor.server.di: compile-only

test-dependencies:
  # StatusPages, to prove a failure it turns into a response is still an error on the span
  - $ktor.server.statusPages
  - $libs.ktor.server.di
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    version: 3.5.2
  kotlin:
    serialization: json
