product: jvm/lib
description: "The stx-workflow store on Redis: one hash per instance, a sorted set of what is due, and a lock apiece"

apply:
  - //publishing.module-template.yaml

dependencies:
  # WorkflowStore, WorkflowRecord and WorkflowEngine are all over this module's public API
  - //libs/stx-workflow/stx-workflow: exported
  # RedisWorkflowStore(redis) takes a connection somebody else opened, so Redis is in its signature
  - //libs/stx-redis: exported

test-dependencies:
  - //libs/stx-testing
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  # Lettuce logs through SLF4J; a no-op provider keeps the test output readable
  - $libs.slf4j.nop

settings:
  kotlin:
    serialization: json
    # this module writes the runnable index through redis.commands directly
    optIns: [ io.lettuce.core.ExperimentalLettuceCoroutinesApi ]
