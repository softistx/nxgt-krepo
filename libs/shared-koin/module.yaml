product: jvm/lib

dependencies:
  # `Module` is this library's entire public API
  - $libs.koin.core: exported

  # One entry per integration, and every one of them compile-only, for the reason
  # libs/shared-ktor/module.yaml spells out: an application that calls `redisModule` already depends
  # on shared-redis, since RedisConfig is the only way to configure it, and one that calls only
  # `kafkaModule` never loads a class from any of the others.
  - //libs/shared-i18n: compile-only
  - //libs/shared-redis: compile-only
  - //libs/shared-mongo: compile-only
  - //libs/shared-amqp: compile-only
  - //libs/shared-kafka: compile-only
  - //libs/shared-storage: compile-only

test-dependencies:
  # the specs start real containers through Koin, so here the libraries are on the runtime classpath
  - //libs/shared-i18n
  - //libs/shared-redis
  - //libs/shared-mongo
  - //libs/shared-amqp
  - //libs/shared-kafka
  - //libs/shared-storage
  - //libs/shared-testing
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop
