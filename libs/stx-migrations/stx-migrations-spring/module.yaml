product: jvm/lib
description: "Spring Boot auto-configuration for stx-migrations, opt-in behind stx.migrations — and a gate, not a listener"

apply:
  - //publishing.module-template.yaml

dependencies:
  # MigrationRunner is the bean this module registers and the type the gate collects.
  - //libs/stx-migrations/stx-migrations: exported
  # The two stores stx.migrations.store can name, and the connections they take. Compile-only, and
  # the same reasoning as stx-migrations-db's own manifest: a ledger cannot be constructed without
  # the library that provides its connection, so an application that names one already depends on
  # it, and one that names none loads a class from neither. @ConditionalOnClass is what keeps the
  # configuration readable when they are absent.
  - //libs/stx-migrations/stx-migrations-db: compile-only
  - //libs/stx-jpa: compile-only
  - //libs/stx-mongo: compile-only
  # spring-context and spring-boot-autoconfigure, which is all this module touches — there is no
  # HTTP surface here.
  - $spring.boot.starter: exported
  # Spring binds Kotlin configuration properties through the primary constructor only when reflect
  # is present — the same line stx-spring-boot and stx-workflow-spring carry.
  - $libs.kotlin.reflect

test-dependencies:
  # No container: what this module adds is the gate and the wiring, and InMemoryLedger from the core
  # is a real ledger. That the ledger works on a real server is stx-migrations-db's question, and
  # examples/spring-orders is where the whole path is run end to end. The store libraries are here
  # so the @ConditionalOnClass nested configurations are actually evaluated rather than skipped —
  # the specs that ask what `store: sql` does without a `Jpa` bean need them present.
  - //libs/stx-migrations/stx-migrations-db
  - //libs/stx-jpa
  - //libs/stx-mongo
  - $spring.boot.starter.test
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  springBoot: enabled
  kotlin:
    # ConfigurationMetadataTest and ConfigurationDocsTest read the metadata JSON with kotlinx
    serialization: json
