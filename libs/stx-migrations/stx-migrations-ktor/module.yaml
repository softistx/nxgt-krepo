product: jvm/lib
description: "Ktor plugin for stx-migrations: install(Migrations) is a gate, and the server does not bind until it passes"

apply:
  - //publishing.module-template.yaml

dependencies:
  # MigrationRunner is what the configuration takes and MigrationRecord is what call.migrations
  # answers with. `gate(runner)` is still the whole contract of the plugin — the DSL below is sugar
  # that ends in a call to it — so an application with a ledger of its own needs nothing under this
  # line.
  - //libs/stx-migrations/stx-migrations: exported
  - $ktor.server.core: exported

  # The two ledgers `sql { }` and `mongo { }` build, and the connections they take. Compile-only, the
  # same rule and the same reason as stx-migrations-spring, which carries these three lines already:
  # a ledger cannot be *constructed* without the library that provides its connection, so an
  # application calling one of the two already depends on it, and one that calls neither — it hands
  # `gate` a runner it built itself — loads a class from none of them.
  #
  # `Stores.kt` is a file of its own so that is true at the class level too: nothing in `Plugin.kt`
  # names a store, so an application that never calls the DSL never loads the class that does.
  #
  # Verified with `./kotlin show dependencies -m stx-migrations-ktor`: these sit in COMPILE and are
  # absent from RUNTIME.
  - //libs/stx-migrations/stx-migrations-db: compile-only
  - //libs/stx-jpa/stx-jpa: compile-only
  - //libs/stx-mongo/stx-mongo: compile-only
  # `publish` and `required` — the resource-lifecycle idiom every plugin in this repo shares. It
  # stays in stx-ktor because it belongs to no integration; this module is a caller of it.
  - //libs/stx-ktor
  # Ktor DI. Installing the plugin registers the ledger with the container, so this is on the
  # runtime classpath of every application that installs it — and exported, because resolving what
  # was registered is the point.
  - $libs.ktor.server.di: exported

test-dependencies:
  # No container anywhere in this module's specs: what is being tested is the gate, and InMemoryLedger
  # from the core is a real ledger with a real conditional claim and a real lock. Which store is
  # underneath it is stx-migrations-db's question, asked there against three of them.
  #
  # The DSL's specs need the two store libraries at runtime — building a `MongoMigrations` really does
  # construct a ledger — but still no server: the driver's client connects lazily, so a database
  # handle over an unreachable URI is enough to prove what `mongo { }` assembles.
  - //libs/stx-migrations/stx-migrations-db
  - //libs/stx-mongo/stx-mongo
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    version: 3.5.2
