product: jvm/lib

dependencies:
  # Stage.Session and Stage.SessionFactory are all over this module's public API.
  - $libs.hibernate.reactive.core: exported
  # Both of these arrive with it, and both are declared anyway: this module imports
  # `org.hibernate.cfg.Configuration` and `jakarta.persistence.AttributeConverter` in its own source,
  # and every entity a consumer writes imports `jakarta.persistence.*`. Exported for that second
  # reason. Leaving them transitive compiles — and leaves the IDE unable to resolve half this file.
  - $libs.hibernate.core: exported
  - $libs.jakarta.persistence: exported
  # `Jpa.connect` takes a Vert.x and `Jpa` holds one, so this is part of the API and not an
  # implementation detail that happens to arrive with a driver.
  - $libs.vertx.core: exported

  # The drivers, all three of them, and none on anyone's compile classpath. Hibernate Reactive names
  # no database of its own: it picks a driver at runtime from the URI scheme, and nothing in this
  # module's source references one. `runtime-only` is what says that — they reach an application's
  # runtime classpath and cannot be coded against through this library, which is right, because a
  # `PgBuilder` in application code is a second connection pool nobody is managing.
  #
  # All three rather than one, because which database this is belongs to the deployment, not to the
  # library. Two unused drivers cost about a megabyte and load no class.
  - $libs.vertx.pg.client: runtime-only
  - $libs.vertx.mysql.client: runtime-only
  - $libs.vertx.db2.client: runtime-only
  - $libs.kotlinx.coroutines.core: exported
  # CloseGuard: the factory is closed by whoever built it, and by a DI container too
  - //libs/shared-common

test-dependencies:
  # the Postgres the integration specs talk to, started for the run when the workspace's own is not
  # named — test-only, so nothing here reaches a consumer of this library
  - //libs/shared-testing
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  # The harness creates and drops each spec's schema with the Postgres client directly, which the
  # runtime-only scope above deliberately does not put on a compile classpath.
  - $libs.vertx.pg.client
  # and the MySQL one, for the spec that proves this library is not Postgres-only
  - $libs.vertx.mysql.client
  # Hibernate and Vert.x both log through SLF4J; a no-op provider keeps the test output readable
  - $libs.slf4j.nop

settings:
  kotlin:
    # An entity is instantiated reflectively, row by row, through a constructor nobody writes: the
    # `jpa` preset gives @Entity, @Embeddable and @MappedSuperclass classes a no-arg one.
    noArg:
      enabled: true
      presets: [ jpa ]
    # And Hibernate subclasses entities to build lazy proxies, which a final Kotlin class refuses.
    # Spelled out rather than taken from a preset because allOpen has no `jpa` one — only spring,
    # micronaut and quarkus.
    allOpen:
      enabled: true
      annotations:
        - jakarta.persistence.Entity
        - jakarta.persistence.MappedSuperclass
        - jakarta.persistence.Embeddable
