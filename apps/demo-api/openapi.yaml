      summary: Change avatar
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: The newly updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    delete:
      tags:
        - users-controller
      summary: Delete avatar
      operationId: deleteAvatar
      responses:
        '200':
          $ref: '#/components/responses/ResourceDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
  /users/search:
    post:
      tags:
        - users-controller
      summary: Get users
      operationId: findUsers
      parameters:
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/first'
        - $ref: '#/components/parameters/last'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    post:
      tags:
        - users-controller
      summary: Create user.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '201':
          description: The newly created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{id}:
    get:
      tags:
        - users-controller
      summary: Get user by ID
      operationId: findUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '200':
          description: The user that matches the provided id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
    put:
      tags:
        - users-controller
      summary: Update user
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          description: The newly updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
        - users-controller
      summary: Update partially user
      operationId: patchUser
      parameters:
        - $ref: '#/components/parameters/id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: The newly patched user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - users-controller
      summary: Delete user
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/id'
      responses:
        '204':
          $ref: '#/components/responses/ResourceDeleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications:
    post:
      tags:
        - notifications-controller
      summary: Queue a notification
      operationId: queueNotification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '201':
          description: The newly queued notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags:
        - notifications-controller
      summary: List notifications
      operationId: findNotifications
      parameters:
        - name: channel
          in: query
          description: Only notifications going out over this channel.
          schema:
            $ref: '#/components/schemas/NotificationChannel'
      responses:
        '200':
          description: The notifications queued so far.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /notifications/purge:
    delete:
      tags:
        - notifications-controller
      summary: Drop every queued notification
      description: Operational tooling, not part of the published client surface.
      operationId: purgeNotifications
      x-internal: true
      x-amazon-apigateway-integration:
        type: aws_proxy
        httpMethod: POST
      responses:
        '204':
          $ref: '#/components/responses/ResourceDeleted'
  /notifications/legacy:
    get:
      tags:
        - notifications-controller
      summary: Read the notification this document does not fully describe
      description: >
        Serves a notification whose channel this document does not list, standing in for a server
        deployed ahead of the spec a client was generated from.
      operationId: findLegacyNotification
      responses:
        '200':
          description: A notification on a channel added after this document was written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
  /notifications/{id}:
    get:
      tags:
        - notifications-controller
      summary: Read notification
      operationId: findNotification
      parameters:
        - name: id
          in: path
          required: true
          description: The unique identifier of the notification.
          schema:
            $ref: '#/components/schemas/NotificationId'
      responses:
        '200':
          description: The notification.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '404':
          $ref: '#/components/responses/NotFound'
  /failures/{mode}:
    get:
      tags:
        - failures-controller
      summary: Fail in a chosen way
      description: >
        Exists so a generated client's error path can be driven deliberately. Each mode answers
        with a different kind of failure: one this document describes, one it describes without a
        body, one it does not describe at all, and one whose body does not parse as the schema the
        document names.
      operationId: triggerFailure
      security: []
      parameters:
        - name: mode
          in: path
          required: true
          description: Which kind of failure to answer with.
          schema:
            type: string
            enum: [ok, typed, bodiless, undocumented, garbled]
      responses:
        '204':
          description: The mode asked for no failure.
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: The service is unavailable, and says nothing else about it.
components:
  securitySchemes:
    Basic:
      type: http
      scheme: basic
      description: Basic authentication
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT bearer token
  schemas:
    SignInRequest:
      type: object
      properties:
        username:
          type: string
          description: The username or email address(if applicable) of the user.
        password:
          type: string
          description: The password for the user account.
      required:
        - username
        - password
    Token:
      type: object
      properties:
        uid:
          type: string
          description: The user identifier associated with the token.
        access:
          type: string
          description: The access token.
        refresh:
          type: string
          description: The refresh token.
      required:
        - uid
        - access
        - refresh
    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          description: Error status code
        message:
          type: string
          description: A human-readable error message.
          default: ''
        debugMessage:
          type: string
          description: An optional debug message for troubleshooting.
          default: null
    SignUpRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          description: The username of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        password:
          type: string
          minLength: 4
          maxLength: 100
          description: The password for the user account.
      required:
        - username
        - password
        - email
    AuditMetadata:
      type: object
      properties:
        createdBy:
          type: string
          description: The user who created the attribute.
        createdDate:
          type: string
          format: date-time
          description: The date and time when the attribute was created.
        lastModifiedBy:
          type: string
          description: The user who last updated the attribute.
        lastModifiedDate:
          type: string
          format: date-time
          description: The date and time when the attribute was last updated.
      required:
        - createdBy
        - createdDate
        - lastModifiedBy
        - lastModifiedDate
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the user.
        username:
          type: string
          description: The username of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        avatar:
          type: string
          description: The URL of the user's avatar image.
        disabled:
          type: boolean
          description: Indicates if the user account is disabled.
        roles:
          type: array
          items:
            type: string
          description: The roles assigned to the user.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the user.
      required:
        - id
        - username
        - email
        - disabled
        - roles
        - metadata
    RefreshTokenRequest:
      type: object
      properties:
        token:
          type: string
          description: The refresh token.
        uid:
          type: string
          description: The user identifier associated with the token.
      required:
        - uid
        - token
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the category.
        family:
          type: string
          description: The family or group to which the category belongs.
        description:
          type: string
          description: A brief description of the category.
        attributes:
          type: array
          items:
            type: string
          description: A set of attribute IDs to be associated with the category.
      required:
        - name
    Category:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the category.
        name:
          type: string
          description: The name of the category.
        family:
          type: string
          description: The family or group to which the category belongs.
        description:
          type: string
          description: A brief description of the category.
        photo:
          type: string
          description: A URL to a photo representing the category.
        attributes:
          type: array
          items:
            type: string
          description: A set of attribute IDs associated with the category.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the category.
      required:
        - id
        - name
        - metadata
    JsonObject:
      type: object
      format: json
    SearchRequest:
      type: object
      properties:
        filter:
          $ref: '#/components/schemas/JsonObject'
          description: The search filter object
        sort:
          $ref: '#/components/schemas/JsonObject'
          description: The search sort object
    PageInfo:
      type: object
      properties:
        startCursor:
          type: string
          description: The cursor corresponding to the first node in edges
        endCursor:
          type: string
          description: The cursor corresponding to the last node in edges
        hasPreviousPage:
          type: boolean
          description: Whether there is a previous page
        hasNextPage:
          type: boolean
          description: Whether there is a next page
    PaginatedCategory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Category'
          description: A list of category objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    Upload:
      type: string
      format: binary
      description: File to upload
    UploadRequest:
      type: object
      properties:
        file:
          $ref: '#/components/schemas/Upload'
    PermissionRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the permission being requested.
        description:
          type: string
          description: A human-readable description of the permission.
      required:
        - name
    Permission:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the permission.
          readOnly: true
        name:
          type: string
          description: The name of the permission.
        description:
          type: string
          description: A human-readable description of the permission.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the permission.
      required:
        - id
        - name
        - metadata
    PaginatedPermission:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'
