  /uploads/{id}:
    get:
      tags:
        - uploads-controller
      summary: Get file by ID
      operationId: findFile
      parameters:
        - $ref: '#/components/parameters/id'
        - name: attachment
          in: query
          schema:
            type: boolean
            default: true
          required: true
          description: Set content disposition to attachment if true, inline otherwise(default value to true).
      responses:
        '200':
          description: The file that matches the provided id
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
