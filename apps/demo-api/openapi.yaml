          minLength: 4
          maxLength: 20
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          type: array
          items:
            type: string
          description: The permissions to be assigned to the role.
      required:
        - name
    Role:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the role.
        name:
          type: string
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          type: array
          items:
            type: string
          description: The permissions associated with the role.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the role.
      required:
        - id
        - name
        - permissions
        - metadata
    PaginatedRole:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'
          description: A list of role objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchRoleRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 20
          description: The name of the role.
        description:
          type: string
          description: A brief description of the role.
        permissions:
          type: array
          items:
            type: string
          description: The permissions to be assigned to the role.
    TagRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
          description: The name of the tag.
        family:
          type: string
          description: The family or category of the tag.
        description:
          type: string
          description: A brief description of the tag.
      required:
        - name
    Tag:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the tag.
        name:
          type: string
          description: The name of the tag.
        family:
          type: string
          description: The family or category of the tag.
        description:
          type: string
          description: A brief description of the tag.
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the tag.
      required:
        - id
        - name
        - metadata
    PaginatedTag:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
          description: A list of tag objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchTagRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
          description: The name of the tag.
        family:
          type: string
          description: The family or category of the tag.
        description:
          type: string
          description: A brief description of the tag.
    FileUpload:
      type: object
      properties:
        name:
          type: string
          description: The name of the file.
        uploadDate:
          type: string
          format: date-time
        contentType:
          type: string
        size:
          type: integer
        chunkSize:
          type: integer
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/AuditMetadata'
          description: Metadata related to the creation and update of the file.
      required:
        - name
        - version
        - uploadDate
        - size
        - chunkSize
        - contentType
        - metadata
    PaginatedFile:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileUpload'
          description: A list of file objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchProfileRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 4
          maxLength: 20
          description: The name of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        password:
          type: string
          minLength: 4
          maxLength: 100
          description: The password for the user account.
    PaginatedUser:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: A list of user objects.
        metadata:
          $ref: '#/components/schemas/PageInfo'
    UserRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          description: The username of the user.
        email:
          type: string
          format: email
          description: The email address of the user.
        password:
          type: string
          minLength: 4
          maxLength: 100
          description: The password for the user account.
        disabled:
          type: boolean
          description: Indicates if the user account is disabled.
        roles:
          type: array
          items:
            type: string
          description: The roles to be assigned to the user.
      required:
        - username
        - password
        - email
    PatchUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: The email address of the user.
        password:
          type: string
          minLength: 4
          maxLength: 100
          description: The password for the user account.
        disabled:
          type: boolean
          description: Indicates if the user account is disabled.
        roles:
          type: array
          items:
            type: string
          description: The roles to be assigned to the user.
    NotificationChannel:
      type: string
      description: How a notification reaches whoever it is for.
      enum:
        - email
        - sms
        - push
      x-enum-varnames:
        - BY_EMAIL
        - BY_SMS
        - BY_PUSH
      x-enum-descriptions:
        - Sent to an address.
        - Sent to a phone number.
        - Sent to a registered device.
    NotificationId:
      type: string
      description: Identifies one queued notification.
      x-kotlin-value-class: true
    NotificationStatus:
      type: string
      description: Where a notification has got to.
      enum:
        - queued
        - sent
        - failed
    NotificationPayload:
      description: What a notification actually says, which differs per channel.
      oneOf:
        - $ref: '#/components/schemas/EmailPayload'
        - $ref: '#/components/schemas/SmsPayload'
        - $ref: '#/components/schemas/PushPayload'
      discriminator:
        propertyName: kind
        mapping:
          email: '#/components/schemas/EmailPayload'
          sms: '#/components/schemas/SmsPayload'
          push: '#/components/schemas/PushPayload'
    EmailPayload:
      type: object
      required:
        - subject
        - body
      properties:
        kind:
          type: string
        subject:
          type: string
          description: The subject line.
        body:
          type: string
    SmsPayload:
      type: object
      required:
        - text
      properties:
        kind:
          type: string
        text:
          type: string
    PushPayload:
      type: object
      required:
        - title
      properties:
        kind:
          type: string
        title:
          type: string
        badge:
          type: integer
    Recipient:
      description: >
        Who a notification is for. There is no discriminator: the two shapes are told apart by the
        keys they carry.
      oneOf:
        - $ref: '#/components/schemas/UserRecipient'
        - $ref: '#/components/schemas/GroupRecipient'
    UserRecipient:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
        email:
          type: string
    GroupRecipient:
      type: object
      required:
        - groupId
      properties:
        groupId:
          type: string
        size:
          type: integer
    NotificationRequest:
      type: object
      description: A notification to queue.
      required:
        - channel
        - recipient
        - payload
      properties:
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipient:
          $ref: '#/components/schemas/Recipient'
        payload:
          $ref: '#/components/schemas/NotificationPayload'
        traceId:
          type: string
          format: uuid
          description: Correlates this notification with the request that asked for it.
        scheduledOn:
          type: string
          format: date
          description: The day it should go out, if not immediately.
        legacyRef:
          type: string
          deprecated: true
          description: Superseded by traceId.
          x-deprecated-reason: Use traceId; legacyRef is dropped after the 2.0 migration.
    Notification:
      description: One queued notification, and what became of it.
      allOf:
        - $ref: '#/components/schemas/NotificationRequest'
        - type: object
          required:
            - id
            - status
            - metadata
          properties:
            id:
              $ref: '#/components/schemas/NotificationId'
            status:
              $ref: '#/components/schemas/NotificationStatus'
            delivery:
              type: object
              description: What the last delivery attempt did.
              x-kotlin-name: DeliveryAttempt
              properties:
                attempts:
                  type: integer
                lastError:
                  type: string
            metadata:
              $ref: '#/components/schemas/AuditMetadata'
  responses:
    BadRequest:
      description: The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An unexpected error occurred on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: The user is not authorized to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The user does not have permission to access the requested resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ResourceDeleted:
      description: The resource was successfully deleted
  parameters:
    cursor:
      in: query
      name: cursor
      description: The cursor to use for pagination. This should be the endCursor value from the previous page of results. If not provided, the first page of results will be returned.
      schema:
        type: string
    first:
      in: query
      name: first
      description: The number of items to return per page. If not provided, the default is 20.
      schema:
        type: integer
    last:
      in: query
      name: last
      description: The number of items to return per page. If not provided, the default is 20.
      schema:
        type: integer
    id:
      name: id
      in: path
      required: true
