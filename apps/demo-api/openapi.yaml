        metadata:
          $ref: '#/components/schemas/PageInfo'
    PatchPermissionRequest:
      type: object
      properties:
        name:
          type: string
          description: The name of the permission being requested.
        description:
          type: string
          description: A human-readable description of the permission.
    RoleRequest:
      type: object
      properties:
        name:
