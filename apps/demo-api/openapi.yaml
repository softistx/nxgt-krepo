      tags:
        - uploads-controller
      summary: Upload file
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '200':
          description: The newly created file's id
          content:
            text/plain:
              schema:
