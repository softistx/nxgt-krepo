# Everything the demo is: the story registry, the catalogue UI and the stories themselves. The two
# launcher modules beside it hold a window and an activity and nothing else, because a module has
# exactly one product type and `android/app` and `jvm/app` cannot be the same one.
product:
  type: kmp/lib
  platforms: [ jvm, android ]

dependencies:
  # The library under demonstration.
  - //libs/stx-material: exported
  # The catalogue is itself a Compose UI, and it reaches for Material 3 directly wherever
  # stx-material has not reached yet — text fields and sliders arrive in phase 2, and the
  # control panel needs them now.
  - $compose.material3: exported
  - $compose.foundation: exported
  - $compose.ui: exported
  - $compose.animation

# The catalogue's own chrome is the library's first consumer, so a defect here is a defect there —
# and "the story list scrolls" is a claim about pixels. ImageComposeScene renders it headlessly;
# skiko's native library comes from $compose.desktop.currentOs, which is jvm-only.
test-dependencies@jvm:
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core
  - $libs.kotest.runner.junit5
  - $compose.desktop.currentOs

settings:
  kotlin:
    optIns:
      - androidx.compose.foundation.style.ExperimentalFoundationStyleApi
      # The Shapes story shows all eight of M3's slots, and three of them — largeIncreased,
      # extraLargeIncreased, extraExtraLarge — arrived with Material 3 expressive and are gated.
      # Showing only the five ungated ones would misrepresent the ladder the theme installs.
      - androidx.compose.material3.ExperimentalMaterial3ExpressiveApi
  compose:
    enabled: true
    version: 1.12.0
  android:
    namespace: com.strange.material.demo
