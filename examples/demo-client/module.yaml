product: jvm/app

dependencies:
  - $libs.ktorfit.lib
  - $ktor.client.cio
  - $ktor.client.contentNegotiation
  - $ktor.serialization.kotlinx.json
  # the spec's `format: date` becomes kotlinx.datetime.LocalDate in the kotlinx style
  - $libs.kotlinx.datetime

test-dependencies:
  # the end-to-end test drives the generated client against the real server
  - //examples/demo-api
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence. `$ktor.*` and a `$libs.*` alias on `version.ref = "ktor"`
    # have to be one version, or a toolchain upgrade splits them silently.
    version: 3.5.2
  kotlin:
    serialization: json
    ksp:
      processors:
        - $libs.ktorfit.ksp

plugins:
  openapi:
    enabled: true
    specs:
      # `spec` is a Path the frontend resolves against this module's root, so `..` reaches the
      # neighbouring module that owns the document.
      - spec: ../demo-api/openapi.yaml
        packageName: com.strange.demo.client.api
