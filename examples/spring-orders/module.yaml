product: jvm/app
description: "A demo order book on stx-spring-boot: a spec-first REST API, keyset paging, an audit trail and two migrations"

dependencies:
  # The library this example is about: the error handler, the web helpers, the Mongo criteria and
  # filter grammar, the audit trail and the migration runner. It exports stx-i18n and stx-common,
  # so `Messages`, `Page` and `ApiException` come with it.
  - //libs/stx-spring-boot

  # Spring Data Reactive Mongo is `compile-only` in stx-spring-boot — a package guarded by
  # `@ConditionalOnClass` is dark until the application adds the library itself. This is the
  # application adding it, and it is the whole demonstration of that rule.
  - $spring.boot.starter.data.mongodb.reactive

  # Object diffing, for the audit trail. Compile-only there for the same reason.
  - $libs.javers.core

  # The telemetry root, the `CoWebFilter` that makes each request a server span, and the
  # `stx.telemetry.*` keys. Nothing starts because this is on the classpath — `stx.telemetry.enabled`
  # in `application.yaml` is what turns it on, the same opt-in rule as every other line here.
  - //libs/stx-telemetry/stx-telemetry-spring

  # The exporter `stx.telemetry.mongo` builds. `compile-only` in stx-telemetry-spring, and of the
  # three lines in this file that follow that rule it is the one with the sharpest reason: it carries
  # the Mongo coroutine driver, so an application that wants no telemetry in a database must not ship
  # one merely because the auto-configuration knows how to use it. This is the application adding it.
  - //libs/stx-telemetry/stx-telemetry-mongo

test-dependencies:
  # The MongoDB the specs drive the whole application against: `MONGO_TEST_URI` when the workspace's
  # replica set is already up, a container started once for the run otherwise, and every feature
  # reports skipped when neither is there.
  #
  # Named here even though `stx-spring-boot`'s `MongoTestConfiguration` is what reads it, because
  # that module holds this one `compile-only` — a test-support package is not something every
  # consumer of the library should inherit, so an application that writes specs opts in by adding the
  # line. `$spring.boot.starter.test` and the Kotest entries below are here for the same reason.
  - //libs/stx-testing

  # `WebTestClient`, which is what makes this an end-to-end test rather than a unit one: it speaks
  # HTTP to a real port, so the routes, the codecs, the exception advice and the Mongo mapping are
  # all exercised the way a client exercises them. Also `@SpringBootTest` itself, which `MongoSpec`
  # carries.
  - $spring.boot.starter.test

  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

  # Spring's own test harness, driven by Kotest: `@SpringBootTest` starts the application once for
  # the module's specs and injects its beans into their constructors. The same extension
  # `nxgt-rest` registers, and the reason a spec here needs no bootstrap of its own — `ProjectConfig`
  # is one line over `stx-spring-boot`'s `SpringProjectConfig`, which is what registers it.
  - $libs.kotest.extensions.spring

plugins:
  # The contract is `openapi/`, split across files and bundled to `api-docs.yaml` by redocly; this
  # turns that bundle into the models and the `@HttpExchange` interfaces the controllers implement.
  # `redocly bundle orders@v1` before building, or this reads the previous contract and says nothing.
  openapi:
    enabled: true
    specs:
      - spec: openapi/api-docs.yaml
        packageName: com.strange.example.orders.api
        client: Spring
        # Not `Auto`, which would give Jackson: `stx.json.enabled` puts kotlinx codecs on WebFlux, so
        # a model that is not `@Serializable` fails to encode at the first response.
        models: Kotlinx
        # `orders-controller` -> `IOrdersService`, `health-controller` -> `IHealthService`.
        interfacePrefix: I
        interfaceSuffix: Service

settings:
  # Applies the Spring Boot BOM (4.1.0), all-open with the `spring` preset — so `@Configuration` and
  # `@MigrationUnit` classes need not be written `open` — and `-java-parameters`.
  springBoot: enabled
  kotlin:
    serialization: json
  jvm:
    # Stated rather than left to detection. The toolchain auto-detects a `main` only in a file named
    # `main.kt`; this one is `OrdersApplication.kt`, because a Spring Boot application is named after
    # its `@SpringBootApplication` class and hiding that in `main.kt` to satisfy a build is the tail
    # wagging the dog.
    mainClass: com.strange.example.orders.OrdersApplicationKt
