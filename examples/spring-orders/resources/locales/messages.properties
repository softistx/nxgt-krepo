# The base catalog. Every key a route can raise has text here; `ApiExceptionHandler` looks each one
# up against the caller's `Accept-Language`, so a key with no text is a response nobody can read.

orders.not-found           = No order with id {id}.
orders.reference-taken     = An order with reference {reference} already exists.
orders.unknown-status      = That is not a status this service knows.

filters.invalid            = That filter cannot be read: {filter}

# Raised by `MongoPage` itself, when a client asks for a page nobody can honour.
pagination.invalid         = That page cannot be served: {reason}

# What an unhandled failure is reported as. `ApiException.KEY_UNEXPECTED`.
errors.unexpected          = Something went wrong.
