spring:
  application:
    name: spring-orders
  mongodb:
    # Spring Boot's own property, not one of ours: `stx.data.mongo` adds to Boot's Mongo
    # configuration and does not re-express it. The workspace's replica set answers here.
    #
    # **`spring.mongodb`, and not `spring.data.mongodb`.** Boot 4 split the old prefix: the driver's
    # URI, host, credentials and database are `MongoProperties` under `spring.mongodb`, while
    # `spring.data.mongodb` kept only GridFS and the big-decimal representation. A `spring.data.mongodb.uri`
    # binds to nothing and is reported by nothing — the driver falls back to `mongodb://localhost/test`,
    # which on a developer machine is a real server that answers. This file said the old spelling until
    # `MongoTestConfiguration` was written and a spec asked what database it had actually been using.
    uri: ${MONGO_URI:mongodb://localhost:27017/spring_orders}

# Everything below is off by default. Nothing in `stx-spring-boot` starts because the jar is on the
# classpath — each of these lines is what turns one auto-configuration on, and removing one removes
# exactly the feature it names. `docs/spring-configuration.md` is the full list.
stx:
  # kotlinx-serialization for request and response bodies, in place of Jackson.
  json:
    enabled: true

  # `ApiException` -> a translated `ErrorResponse`. Needs a `Messages` bean, which `stx.i18n` below
  # contributes; without one the context refuses to start and says so, which is the point.
  errors:
    enabled: true
    # A demo, so the developer-facing half of a failure is visible. Leave this off in a deployment:
    # a debug message is written for a stack trace, not for a reader.
    include-debug-message: true

  i18n:
    enabled: true
    languages: [ en, fr ]
    fallback: en
    # A demo should not answer a request with the name of a key nobody translated.
    fail-on-missing-key: false

  cors:
    enabled: true
    origins: [ "http://localhost:5173" ]

  data:
    mongo:
      # The `kotlin.time.Instant` converters. Without this, `Order.placedAt` fails at *query* time
      # with `Can't find a codec` — not at mapping time, which is what makes it worth a line here.
      enabled: true
      # `@Indexed` on `Order.reference` and `Order.placedAt` becomes a real index, once, after the
      # application is ready. Nothing is ever dropped.
      create-indexes: true
      audit:
        # Every save and delete of an `@Auditable` document appends a version to `audits`.
        enabled: true

  # `V1Seed` and `V2Tags` run once each, lowest version first, before this application serves
  # anything — the gate is an `InitializingBean`, so a migration that throws is a context that does
  # not refresh and a port that never opens. The ledger is `stx_migrations`, and `store: mongo` is
  # what says which of the two it is: nothing is inferred from what happens to be on the classpath.
  #
  # No `stx.mongo` here, deliberately. The ledger needs the coroutine driver's `MongoDatabase`, and
  # `stx-spring-boot` bridges one from the `ReactiveMongoDatabaseFactory` Spring Data already has —
  # turning on `stx.mongo` would open a second pool against the same server and, under test, one
  # pointed at a different database than the suite's.
  migrations:
    enabled: true
    store: mongo

  telemetry:
    # A root, *installed* — which is what lets `logger<OrderService>()` and `span { }` in the service
    # find it with nothing injected and nothing passed down — plus a `CoWebFilter` that makes each
    # request a server span. `service` is deliberately absent: it falls back to
    # `spring.application.name`, which this file already answers with `spring-orders`.
    enabled: true
    environment: development
    # One readable line per signal on stdout, so `./kotlin run` shows the spans closing as requests
    # arrive. Development only — a deployment wants `json-lines`, or a real destination.
    console: true
    # `/health` is what a load balancer asks every second. A trace nobody will ever read is otherwise
    # most of the traces there are.
    ignore: [ /health ]

    mongo:
      # Signals into a collection, one unordered `insertMany` per batch, with retention as a TTL
      # index Mongo enforces itself rather than a job this process has to run.
      enabled: true
      # **Telemetry's own client**, which is why this key exists next to `spring.mongodb.uri` instead
      # of reusing it: a burst of telemetry must not exhaust the pool the orders are queueing for.
      # The same server here because a demo has one; a deployment points this somewhere else.
      uri: ${TELEMETRY_MONGO_URI:mongodb://localhost:27017}
      # Its own database too, so a shared server does not mix this demo's signals with another's.
      database: spring_orders_telemetry
      # A demo's signals are not worth the default month. Changing this drops and rebuilds the index
      # rather than leaving the old window quietly in place.
      retention: 7d

logging:
  level:
    com.softistx.migrations: INFO
