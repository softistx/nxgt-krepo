# The `test` profile the specs activate with `@ActiveProfiles("test")`. It overrides three keys of
# `resources/application.yaml` and inherits the rest, so the specs exercise the application's real
# configuration rather than a second copy of it.

server:
  # `@SpringBootTest(webEnvironment = DEFINED_PORT)` binds the port named here, which is what lets
  # the clients hold a constant base URL. Not 8080: a demo left running in another terminal should
  # not make the suite fail — or worse, pass against the wrong process.
  port: 8088

spring:
  data:
    mongodb:
      # A placeholder. `OrdersSpec` registers the resolved endpoint through `@DynamicPropertySource`,
      # which outranks every property source there is, so what a spec talks to is the container or
      # the server `MONGO_TEST_URI` names — never the `spring_orders` database a `./kotlin run` uses.
      uri: mongodb://127.0.0.1:27017/spring_orders_test

stx:
  i18n:
    # A test suite should not pass over a translation nobody wrote.
    fail-on-missing-key: true
