# The `test` profile the specs activate through `MongoSpec`. It overrides three keys of
# `resources/application.yaml` and inherits the rest, so the specs exercise the application's real
# configuration rather than a second copy of it.

server:
  # `@SpringBootTest(webEnvironment = DEFINED_PORT)` — inherited from `SpringSpec` — binds the port
  # named here, and `stx-spring-boot`'s `TestServer.STX_TEST_PORT` is the same number, which is what
  # lets a client be built without anybody spelling a URL. Not 8080: a demo left running in another
  # terminal should not make the suite fail — or worse, pass against the wrong process.
  port: 8088

spring:
  mongodb:
    # The database these specs get, and never the `spring_orders` a `./kotlin run` writes to. It is a
    # *prefix*: `stx-spring-boot`'s `testDatabase` appends this run's suffix, so a second suite against
    # the same `MONGO_TEST_URI` server cannot clear this one's orders. `MongoTestConfiguration` splices
    # the result into the connection string it builds from the container or from that server — so no
    # URI is named here, and there is no placeholder to mistake for one.
    database: spring_orders_test

stx:
  i18n:
    # A test suite should not pass over a translation nobody wrote.
    fail-on-missing-key: true

  telemetry:
    # Left enabled, so every request a spec makes goes through the same server span the demo runs
    # with — the filter and the root are part of the configuration under test, not scenery.
    console: false
    mongo:
      # The exporter, though, is off. Its client is **its own**, and no bean redirects it: the URI
      # would be the `localhost:27017` in `application.yaml` — a developer's real server — and not
      # the container or `MONGO_TEST_URI` server `MongoTestConfiguration` resolves for everything
      # else here. A suite must not write to an address nobody chose for it.
      #
      # What the signals go to instead is `TelemetryCollector`, an `Exporter` bean, which is also the
      # seam an application with a destination of its own uses: declare the bean, say nothing else.
      enabled: false
