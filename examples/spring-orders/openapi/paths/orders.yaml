get:
  tags:
    - orders-controller
  summary: A page of orders, narrowed and ordered by the query string.
  operationId: findOrders
  parameters:
    - $ref: ../components/parameters/filter.yaml
    - $ref: ../components/parameters/sort.yaml
    - $ref: ../components/parameters/size.yaml
    - $ref: ../components/parameters/cursor.yaml
  responses:
    '200':
      description: One page, with the cursors to ask for the next.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrderPage.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
post:
  tags:
    - orders-controller
  summary: Place an order.
  operationId: placeOrder
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/PlaceOrder.yaml
  responses:
    '201':
      description: The order as placed, with the id it was given.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/OrderResponse.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '409':
      $ref: ../components/responses/Conflict.yaml
    '500':
      $ref: ../components/responses/InternalError.yaml
