# workflow-checkout in a container, on the workspace's Redis. Two profiles:
#
#   dev    the checkout mounted and run by `./kotlin run`         COMPOSE_PROFILES=dev
#   prod   the executable jar on a JRE, built into an image        COMPOSE_PROFILES=prod
#
#   cp .env.example .env
#   docker compose up
#
# Three checkouts, narrated, then it exits. Redis needs no setup: no user, no database to create.
# `docs/examples-in-docker.md` has the whole arrangement.
name: krepo-workflow-checkout

x-app: &app
  environment:
    MODULE: workflow-checkout
    # The workspace's Redis by its alias on `proxy`. Database 15, and a namespace the run deletes
    # on the way out, so it shares the server with nothing it could disturb.
    REDIS_URI: redis://${REDIS_HOST:-redis}:6379/${REDIS_DB:-15}

services:
  dev:
    extends: { file: ../docker/compose.base.yaml, service: dev }
    <<: *app

  prod:
    extends: { file: ../docker/compose.base.yaml, service: prod }
    <<: *app
    image: krepo-examples/workflow-checkout
    build:
      args:
        MODULE: workflow-checkout
    # It runs once and exits, so nothing restarts it — `docker compose up` again runs it again.
    restart: "no"

volumes:
  kotlin-cache:
    name: krepo-kotlin-cache
  build:

networks:
  proxy:
    external: true
