product: jvm/app
description: A Ktor GraphQL catalogue showing stx-graphix-ktor — annotated queries and mutations over HTTP

dependencies:
  - //libs/stx-graphix/stx-graphix
  - //libs/stx-graphix/stx-graphix-ktor
  - $ktor.server.core
  - $ktor.server.netty
  - $libs.slf4j.nop

test-dependencies:
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  ktor:
    enabled: true
    version: 3.5.2
  kotlin:
    serialization: json
  jvm:
    # Stated rather than left to detection. The toolchain auto-detects a `main` only in a file named
    # `main.kt`; this one is `Shop.kt`, next to the `Catalog` it serves.
    mainClass: com.softistx.example.graphix.shop.ShopKt
