product: jvm/app
description: A Ktor GraphQL catalogue showing stx-graphql-ktor — annotated queries and mutations over HTTP

dependencies:
  - //libs/stx-graphql/stx-graphql
  - //libs/stx-graphql/stx-graphql-ktor
  - $ktor.server.core
  - $ktor.server.netty
  - $libs.slf4j.nop

test-dependencies:
  - $ktor.server.testHost
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

settings:
  ktor:
    enabled: true
    version: 3.5.2
  kotlin:
    serialization: json
