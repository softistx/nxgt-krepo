product: jvm/app

dependencies:
  # spring-web carries the @HttpExchange annotations and HttpServiceProxyFactory
  - $libs.spring.web
  # HttpServiceProxyFactory builds an AOP proxy and formats argument values; neither
  # spring-aop nor spring-context comes in transitively through spring-web
  - $libs.spring.aop
  - $libs.spring.context
  # WebClient and its adapter live in webflux; suspend functions need a reactive adapter
  - $libs.spring.webflux
  - $libs.kotlinx.coroutines.reactor
  # Jackson 3 binds the generated models; the Kotlin module reads their primary constructors
  - $libs.jackson.module.kotlin

test-dependencies:
  # the end-to-end test drives the generated client against the real server
  - //examples/demo-api
  - $libs.kotest.runner.junit5
  - $libs.kotest.framework.engine
  - $libs.kotest.assertions.core

plugins:
  # Two documents, two packages, one module. This is the case the list exists for: a client of more
  # than one upstream API used to need a module per API, because the plugin took a single `specFile`
  # and a single `packageName`. The packages must differ — every spec writes into one output
  # directory, so sharing one would have the second overwrite the first, and the plugin refuses it.
  openapi:
    enabled: true
    specs:
      - spec: ../demo-api/openapi.yaml
        packageName: com.softistx.demo.spring.api
        client: Spring

      # The orders API, from the bundle `redocly` writes. Nothing here calls it; it is generated to
      # prove that a second document lands beside the first with its own models, its own interfaces
      # and its own `Endpoints`, and that the two do not tread on each other.
      - spec: ../spring-orders/openapi/api-docs.yaml
        packageName: com.softistx.demo.spring.orders
        client: Spring

settings:
  jvm:
    # Stated rather than left to detection. The toolchain auto-detects a `main` only in a file
    # named `main.kt`; this one is `SpringDemo.kt`.
    mainClass: com.softistx.demo.spring.SpringDemoKt
