product: jvm/app

dependencies:
  - $ktor.server.core
  - $ktor.server.netty
  - $ktor.server.contentNegotiation
  - $ktor.serialization.kotlinx.json
  # the spec's `format: date` becomes kotlinx.datetime.LocalDate in the kotlinx style
  - $libs.kotlinx.datetime
  # Ktor logs through SLF4J; a no-op provider keeps the test output readable
  - $libs.slf4j.nop

settings:
  ktor:
    enabled: true
    # Pinned to the catalog's `ktor` version rather than left to the toolchain's default, which is
    # the same number today by coincidence. `$ktor.*` and a `$libs.*` alias on `version.ref = "ktor"`
    # have to be one version, or a toolchain upgrade splits them silently.
    version: 3.5.2
  kotlin:
    serialization: json
  jvm:
    # Stated rather than left to detection. The toolchain auto-detects a `main` only in a file
    # named `main.kt`; this one is `DemoServer.kt`.
    mainClass: com.strange.demo.api.DemoServerKt
