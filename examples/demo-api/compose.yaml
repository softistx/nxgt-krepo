# demo-api in a container, behind Traefik. Two profiles:
#
#   dev    the checkout mounted and run by `./kotlin run`         COMPOSE_PROFILES=dev
#   prod   the executable jar on a JRE, built into an image        COMPOSE_PROFILES=prod
#
#   cp .env.example .env
#   docker compose up -d
#   curl http://demo-api.localhost/failures/typed   # a documented 404, with its body
#
# demo-client and demo-spring-client call it at http://demo-api:8080/ — start this one first.
# `docs/examples-in-docker.md` has the whole arrangement.
name: krepo-demo-api

x-app: &app
  environment:
    MODULE: demo-api
  # Its name on `proxy` in either profile, which is what demo-client and demo-spring-client call.
  networks:
    proxy:
      aliases: [ demo-api ]
  labels:
    - traefik.enable=${TRAEFIK_ENABLE:-true}
    - traefik.docker.network=proxy
    - traefik.http.routers.krepo-demo-api.rule=Host(`demo-api.${HOST:-localhost}`)
    - traefik.http.routers.krepo-demo-api.entrypoints=${TRAEFIK_HTTP_ENTRYPOINTS:-web}
    - traefik.http.routers.krepo-demo-api.tls=${TRAEFIK_USE_TLS:-false}
    - traefik.http.services.krepo-demo-api.loadbalancer.server.port=8080

services:
  dev:
    extends: { file: ../docker/compose.base.yaml, service: dev }
    <<: *app

  prod:
    extends: { file: ../docker/compose.base.yaml, service: prod }
    <<: *app
    image: krepo-examples/demo-api
    build:
      args:
        MODULE: demo-api

volumes:
  kotlin-cache:
    name: krepo-kotlin-cache
  build:

networks:
  proxy:
    external: true
