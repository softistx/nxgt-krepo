[versions]
# This repo's own published artifacts, which the examples consume from mavenLocal.
stx = "0.2.1"
agp = "9.0.1"
kotlin = "2.4.0"
ksp = "2.3.7"
kotlinx-coroutines = "1.11.0"
coreKtx = "1.19.0"
junit = "4.13.2"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
androidx-biometric = "1.4.0-alpha07"
androidx-test-junit = "1.3.0"
kodein = "7.33.0"
apollo = "5.1.0"
room = "2.8.4"
work = "2.11.2"
accompanist = "0.37.3"
kotlinx-serialization = "1.11.0"
material3 = "1.4.0"
datastore = "1.2.1"
coil = "2.7.0"
# Coil 3 is the Compose Multiplatform line (android, jvm, ios). The 2.7.0 alias above is
# Android-only (`io.coil-kt:coil-compose`) and stays for Gradle consumers of the compose bundle.
coil3 = "3.6.0"
# Material 3 for Compose Multiplatform. **Not `$compose.material3`**, which the toolchain cannot
# resolve for Compose 1.12.0: it guesses 1.11.0-alpha07 and warns that it is guessing, and the build
# only ends up on the right jar because window-size-class and adaptive-navigation-suite below are
# pinned here and drag material3 up to meet them. Drop either of those and the guess would quietly
# win — `./kotlin show dependencies -m stx-material` shows the upgrade arrow that says so. M3 has
# its own alpha line and does not follow foundation/ui's 1.12.0, so it is named explicitly.
compose-multiplatform-material3 = "1.12.0-alpha03"
# Pinned to the Compose Multiplatform 1.12.0 pairing (What's new in CMP 1.12.0). Adaptive
# sits on its own version line, like material3 above.
compose-multiplatform-adaptive = "1.3.0-beta02"
# CMP 1.12.0 pairing table: org.jetbrains.androidx.navigation3 1.2.0-alpha02.
compose-multiplatform-nav3 = "1.2.0-alpha02"
material-kolor = "5.0.1"
compose-destinations = "2.3.0"

ktor = "3.5.2"
kotlinx-rpc = "0.10.3"
logback = "1.6.3"
mongodb = "5.11.0"
coroutines = "1.11.0"
graalvm-native = "1.1.4"
swagger-parser = "2.1.48"
kotlinpoet = "2.3.0"
ktorfit = "2.7.5"
koin = "4.2.2"
koin-compiler = "1.1.0"
kotest = "6.2.4"
testcontainers = "2.0.5"
lettuce = "7.7.0.RELEASE"
minio = "9.0.3"
kafka = "4.3.1"
amqp-client = "5.35.0"
confluent = "8.3.1"
hibernate-reactive = "4.5.5.Final"
# What hibernate-reactive-core 4.5.5.Final resolves for each of these. All three have to move with
# it: a mismatched pair fails at runtime with a driver or a provider it cannot find, not at build
# time.
vertx = "5.1.6"
hibernate-orm = "7.4.5.Final"
jakarta-persistence = "3.2.0"
# Bean Validation: the reference implementation, the API an entity writes against, and the
# expression language its default message interpolator needs at runtime.
hibernate-validator = "9.1.3.Final"
jakarta-validation = "3.1.1"
expressly = "6.0.0"
# Classpath scanning, for `Jpa.scan`. The version kotest already resolves, so a test run carries one.
classgraph = "4.8.194"
# `@Language`, so the IDE injects HQL and SQL into the query strings. Compile-only on stx-jpa;
# 26.1.0 is the current line and still owns `org.intellij.lang.annotations.Language`.
jetbrains-annotations = "26.1.0"
spring = "7.0.9"
# Object diffing for the stx-spring-boot Mongo audit trail: it compares the previous stored state
# with the one just saved and reports the changed properties, which is the whole reason that trail is
# more than a copy of the document. Compile-only in stx-spring-boot — nothing else has it on a
# classpath.
javers = "7.11.8"
jackson = "3.2.2"
graphql-java = "26.1"
dgs-codegen = "8.6.0"

