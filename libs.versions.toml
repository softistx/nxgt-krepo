kotest-assertions-ktor = { module = "io.kotest:kotest-assertions-ktor", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotest-extensions-spring = { module = "io.kotest:kotest-extensions-spring", version.ref = "kotest" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq", version.ref = "testcontainers" }
testcontainers-minio = { module = "org.testcontainers:testcontainers-minio", version.ref = "testcontainers" }
testcontainers-kafka = { module = "org.testcontainers:testcontainers-kafka", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-mysql = { module = "org.testcontainers:testcontainers-mysql", version.ref = "testcontainers" }

lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
minio = { module = "io.minio:minio", version.ref = "minio" }
# Hibernate Reactive brings hibernate-core and the Jakarta Persistence API with it, and both are
# named here anyway: `stx-jpa` imports `org.hibernate.cfg.Configuration` itself, and every entity
# anyone writes imports `jakarta.persistence.*`. A module declares what it imports rather than
# inheriting it from somebody else's graph — which is also what the IDE resolves against, since it
# does not follow that transitive edge and reports the whole file as unresolved when it is missing.
# vertx-pg-client is named for a different reason: it is the driver, chosen rather than inherited,
# and it carries com.ongres.scram:scram-client, which Postgres SASL auth needs.
hibernate-reactive-core = { module = "org.hibernate.reactive:hibernate-reactive-core", version.ref = "hibernate-reactive" }
hibernate-core = { module = "org.hibernate.orm:hibernate-core", version.ref = "hibernate-orm" }
jakarta-persistence = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jakarta-persistence" }
# The Vert.x API `Jpa` itself speaks — an application can hand in the loop it already runs.
vertx-core = { module = "io.vertx:vertx-core", version.ref = "vertx" }
# The three drivers Hibernate Reactive can speak to. Nothing compiles against them: the one that is
# used is chosen at runtime from the URI scheme, which is why `stx-jpa` declares all three
# runtime-only. Each carries the SCRAM or authentication support its own protocol needs.
vertx-pg-client = { module = "io.vertx:vertx-pg-client", version.ref = "vertx" }
vertx-mysql-client = { module = "io.vertx:vertx-mysql-client", version.ref = "vertx" }
vertx-db2-client = { module = "io.vertx:vertx-db2-client", version.ref = "vertx" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }
jakarta-validation = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
# Hibernate Validator interpolates a message like "must be between {min} and {max}" through Jakarta
# Expression Language, and ships no implementation of it. Runtime-only: nobody writes EL here, and
# without it every validator built is a `NoClassDefFoundError` at the first constraint.
expressly = { module = "org.glassfish.expressly:expressly", version.ref = "expressly" }
classgraph = { module = "io.github.classgraph:classgraph", version.ref = "classgraph" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }

kafka-clients = { module = "org.apache.kafka:kafka-clients", version.ref = "kafka" }
amqp-client = { module = "com.rabbitmq:amqp-client", version.ref = "amqp-client" }
confluent-kafka-avro-serializer = { module = "io.confluent:kafka-avro-serializer", version.ref = "confluent" }

nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version = "10.9.1" }
icu4j = { module = "com.ibm.icu:icu4j", version = "78.3" }
