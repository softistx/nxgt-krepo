kotlin-faker = { module = "io.github.serpro69:kotlin-faker" }
kotlin-faker-books = { module = "io.github.serpro69:kotlin-faker-books" }
kotlin-faker-tech = { module = "io.github.serpro69:kotlin-faker-tech" }
kotlin-faker-lorem = { module = "io.github.serpro69:kotlin-faker-lorem" }
