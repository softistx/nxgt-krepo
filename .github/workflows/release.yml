name: Release

on:
  push:
    branches: [develop]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Cache the toolchain and the dependency cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml') }}
          restore-keys: kotlin-${{ runner.os }}-

      # Opens or updates a "Version Packages" pull request against develop, carrying CHANGELOG.md,
      # package.json, and the two lines scripts/sync-version.ts propagates into the Kotlin build.
      # Merging that PR is the decision to release.
      #
      # Only `version-script:` is given. The publish is the step below, in this same job, because a tag
      # pushed with GITHUB_TOKEN does not trigger another workflow — a separate `on: push: tags`
      # workflow would simply never run, or would need a PAT to exist at all.
      - name: Version Packages PR
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: bun run version
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Central
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          # Organisation secrets on `softistx`. An org secret whose repository access does not
          # include this repository arrives as an EMPTY string, not as an error — hence the guard
          # below, which fails in seconds instead of a 401 twenty minutes in.
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME }}
          KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD: ${{ secrets.KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD }}
          KOTLIN_TOOLCHAIN_SIGNING_KEY: ${{ secrets.KOTLIN_TOOLCHAIN_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(bun --print "require('./package.json').version")

          # Idempotent: re-running the workflow on an already released commit publishes nothing.
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi

          for v in KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_USERNAME \
                   KOTLIN_TOOLCHAIN_MAVEN_CENTRAL_PASSWORD \
                   KOTLIN_TOOLCHAIN_SIGNING_KEY; do
            if [ -z "${!v:-}" ]; then
              echo "::error::$v is empty. Check the softistx organisation secret exists and that its"
              echo "repository access includes softistx/nxgt-krepo."
              exit 1
            fi
          done

          # Maven Central and signing are not committed enabled — signArtifacts breaks
          # `./kotlin publish mavenLocal` for anyone without a PGP key, and enabling Central with
          # signing off is refused at model load. docs/releasing.md has both measurements.
          bun scripts/enable-central.ts

          # The publish task caches, and its up-to-date check does not notice a module.yaml edit —
          # it reuses build/tasks/_<module>_prepareMavenPublishables/. This job has just rewritten
          # `version:` and enabled signing, so without this it would republish the previous version,
          # unsigned, and report success.
          rm -rf build/incremental.state

          # An explicit -m selection is required: a bare `kotlin publish <id>` walks every module in
          # the project and stops at the first one that does not publish — an example, not a
          # library. The three jvm/amper-plugin modules are excluded too; the toolchain cannot
          # publish a plugin yet.
          ./kotlin publish mavenCentral $(grep -rl publishing.module-template.yaml libs \
            --include=module.yaml | xargs -n1 dirname | xargs -n1 basename | sed 's/^/-m /')

          git checkout publishing.module-template.yaml

          echo "::notice::Uploaded to the Central Portal in manual mode. Release it at"
          echo "https://central.sonatype.com/publishing/deployments — nothing is public until you do."

      - name: Tag and release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(bun --print "require('./package.json').version")
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged."
            exit 0
          fi
          git tag "v$VERSION"
          git push origin "v$VERSION"

          # The CHANGELOG section for this version is the release body.
          awk -v v="## $VERSION" '
            $0 == v { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          gh release create "v$VERSION" --title "v$VERSION" --notes-file release-notes.md
          rm -f release-notes.md
