name: CI

on:
  pull_request:
    branches: [develop, "integration/**"]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The wrapper prints a welcome banner the first time it provisions a distribution.
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The wrapper downloads the Kotlin CLI and a JRE on first use, then the compiler and every
      # dependency. Without this the first step of every run is a multi-minute download.
      - name: Cache the toolchain and the dependency cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: kotlin-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml') }}
          restore-keys: kotlin-${{ runner.os }}-

      # The examples and the servers may not name a `//libs/...` dependency: they resolve
      # `io.github.softistx:stx-*` as published coordinates, from mavenLocal. That is the whole
      # point of them — a module path proves the sources compile, a coordinate proves the POM — but
      # it means a runner's empty ~/.m2 cannot build anything under examples/ until the libraries
      # are published into it. This step is the CI form of the loop every contributor runs.
      #
      # The stx artifacts are dropped first rather than trusted from the cache: a stale one is
      # exactly the failure this arrangement exists to expose, and a cache hit would hide it.
      - name: Publish the libraries to mavenLocal
        run: |
          rm -rf ~/.m2/repository/io/github/softistx
          ./kotlin publish mavenLocal $(grep -rl publishing.module-template.yaml libs \
            --include=module.yaml | xargs -n1 dirname | xargs -n1 basename | sed 's/^/-m /')

      # Never pipe ./kotlin into tail or grep: the pipeline reports the filter's exit code, so a
      # failed build reads as success. These run bare.
      - run: ./kotlin build

      # The integration specs resolve each backing service in one order: an environment variable if
      # it names a server, otherwise a container started once for the run, otherwise the spec skips.
      # Nothing is exported here, so everything runs against Testcontainers. If this runs out of
      # memory on a standard runner, the fix is to provision the services as `services:` and export
      # POSTGRES_TEST_URI and friends — that seam is what libs/stx-testing was built around.
      - run: ./kotlin test

  lint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Pinned, and the pin must match what CONTRIBUTING.md tells a contributor to install: two
      # ktlint versions disagree about formatting, and the disagreement surfaces as a CI failure
      # nobody can reproduce locally.
      - name: Install ktlint 1.8.0
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
      # `!build/**` is not optional: without it ktlint lints KSP and plugin output and reports
      # thousands of violations in files nobody edits.
      - run: ./ktlint --relative "**/*.kt" "!build/**"

  changeset:
    name: Changeset declared
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: A PR that touches libs/ must declare what it does to the published artifacts
        env:
          BASE: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "origin/$BASE...HEAD")
          if ! echo "$changed" | grep -q '^libs/'; then
            echo "No change under libs/ — no changeset needed."
            exit 0
          fi
          if echo "$changed" | grep -qE '^\.changeset/[^/]+\.md$'; then
            echo "Changeset found."
            exit 0
          fi
          echo "::error::This PR changes libs/ but adds no changeset."
          echo "Run 'bun changeset', pick patch/minor/major, and commit the file it writes."
          echo "See .changeset/README.md for why the package is the repository itself."
          exit 1

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # bun strips types, it does not check them — so TypeScript under `bun scripts/*.ts` buys
      # nothing at all unless something runs tsc. This is that something, and it runs before the
      # tests because a type error is the cheaper failure to read.
      - run: bun run typecheck

      # scripts/sync-version.ts decides what version 45 modules publish under, in a job nobody
      # watches. It gets a test.
      - run: bun test scripts/
