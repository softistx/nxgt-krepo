name: CI

on:
  pull_request:
    branches: [develop, "integration/**"]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The wrapper prints a welcome banner the first time it provisions a distribution.
  KOTLIN_CLI_NO_WELCOME_BANNER: 1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # For `scripts/modules.ts`, which is what selects the modules to publish below. No
      # `bun install`: that script imports nothing but node builtins, so the dependencies this
      # repository has for Changesets are not needed here and downloading them would be waste.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The wrapper downloads the Kotlin CLI and a JRE on first use, then the compiler and every
      # dependency. Without this the first step of every run is a multi-minute download.
      #
      # ~/.gradle is the Android half. The toolchain packages examples/material-demo/md-android by
      # delegating to a Gradle build, and fetches that Gradle distribution and the Android Gradle
      # plugin's dependencies into ~/.gradle — not into its own cache. Uncached, that was three of
      # the build step's six minutes, spent before the first Gradle task ran.
      #
      # `v2` marks the path list, not the contents. actions/cache folds the paths into an entry's
      # version, so an entry saved with a different list is never restored — not even through a
      # restore key. Change the list and the prefix together, and expect the first run after it
      # to start cold.
      - name: Cache the toolchain and the dependency cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
            ~/.gradle/wrapper/dists
            ~/.gradle/caches/modules-2
          key: kotlin-v2-${{ runner.os }}-${{ hashFiles('kotlin', 'libs.versions.toml') }}
          restore-keys: kotlin-v2-${{ runner.os }}-

      # The examples and the servers may not name a `//libs/...` dependency: they resolve
      # `io.github.softistx:stx-*` as published coordinates, from mavenLocal. That is the whole
      # point of them — a module path proves the sources compile, a coordinate proves the POM — but
      # it means a runner's empty ~/.m2 cannot build anything under examples/ until the libraries
      # are published into it. This step is the CI form of the loop every contributor runs.
      #
      # The stx artifacts are dropped first rather than trusted from the cache: a stale one is
      # exactly the failure this arrangement exists to expose, and a cache hit would hide it.
      - name: Publish the libraries to mavenLocal
        run: |
          rm -rf ~/.m2/repository/io/github/softistx
          ./kotlin publish mavenLocal $(bun scripts/modules.ts --publish-args)

      # Never pipe ./kotlin into tail or grep: the pipeline reports the filter's exit code, so a
      # failed build reads as success. These run bare.
      - run: ./kotlin build

      # A spec resolves its backend in one order: the environment variable if it names a server,
      # otherwise a container started once *per test JVM*, otherwise it skips. That last distinction
      # is what this step is for. The toolchain runs several modules' test JVMs at once, and each one
      # that finds no variable starts its own Postgres, its own Redis, its own RabbitMQ — so a bare
      # `./kotlin test` had a four-vCPU runner booting the same six servers several times over.
      # Nothing ran out of memory; everything ran out of CPU. vert.x reported its event loop blocked
      # for eight seconds, and the failures were all timeouts and wall-clock assertions.
      #
      # One server each, started once here, is what libs/core/stx-testing's environment seam exists for.
      # `docker run` rather than `services:` because two of these need arguments a service block
      # cannot pass: MySQL needs `--mysql-native-password=ON` for the ALTER one spec is built around,
      # and Mongo needs `--replSet` plus an `rs.initiate` — `startTransaction` fails against a
      # standalone mongod, and a driver that reaches one reports it as "does not support retryable
      # writes", which is what this run actually saw.
      #
      # Kafka is deliberately left to Testcontainers: only one module starts it, and the KRaft
      # bootstrap a single broker needs is a dozen environment variables that ConfluentKafkaContainer
      # already gets right.
      - name: One of each backing service, for the whole run
        run: |
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_USER=test -e POSTGRES_PASSWORD=test -e POSTGRES_DB=test postgres:18-alpine
          docker run -d --name mysql -p 3306:3306 \
            -e MYSQL_ROOT_PASSWORD=test -e MYSQL_DATABASE=test mysql:8.4 --mysql-native-password=ON
          docker run -d --name redis -p 6379:6379 redis:8-alpine
          docker run -d --name rabbitmq -p 5672:5672 rabbitmq:4-management
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          docker run -d --name mongo -p 27017:27017 mongo:8 --replSet rs0 --bind_ip_all

          # A replica set is not up when the process is: `available` in MongoTestCluster sends a
          # `hello` for exactly this reason, and an uninitiated set answers as a standalone.
          for _ in $(seq 1 90); do
            docker exec mongo mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for _ in $(seq 1 60); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null)" = "1" ] && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.status().myState'

      # Each of these is refused unless it is complete — Postgres, MySQL and MinIO need their
      # credentials alongside the endpoint, or stx-testing falls through to a container rather than
      # sending the run at half of somebody's server. The AMQP URI carries no trailing slash: a bare
      # one asks for the *empty* vhost, which the broker refuses with a message about permissions.
      - name: Point the specs at them
        run: |
          {
            echo "POSTGRES_TEST_URI=postgresql://localhost:5432/test"
            echo "POSTGRES_TEST_USER=test"
            echo "POSTGRES_TEST_PASSWORD=test"
            echo "MYSQL_TEST_URI=mysql://localhost:3306/test"
            echo "MYSQL_TEST_USER=root"
            echo "MYSQL_TEST_PASSWORD=test"
            echo "REDIS_TEST_URI=redis://localhost:6379/15"
            echo "AMQP_TEST_URI=amqp://guest:guest@localhost:5672"
            echo "MINIO_TEST_ENDPOINT=http://localhost:9000"
            echo "MINIO_TEST_ACCESS_KEY=minioadmin"
            echo "MINIO_TEST_SECRET_KEY=minioadmin"
            echo "MONGO_TEST_URI=mongodb://localhost:27017/?replicaSet=rs0"
          } >> "$GITHUB_ENV"

      # **One module's test JVM at a time, against the servers above.** Measured on this four-vCPU
      # runner, 2026-09-12:
      #
      # | shape                                   | test step | green                             |
      # | --------------------------------------- | --------- | --------------------------------- |
      # | `-m` in a loop, one module at a time    | 426 s     | every run                         |
      # | `-m` under `xargs -P 2`                 | 419 s     | 1 of 1                            |
      # | bare `./kotlin test`                    | 167–233 s | 3 of 5, harness timeouts raised   |
      #
      # The bare run is faster because it pays the CLI's start-up once instead of fifty-seven times
      # (about four seconds each), not because of parallelism: two invocations at once already
      # saturate the CPU, which is why -P 2 bought nothing. But the CLI then runs module JVMs as wide
      # as it likes — some sixteen at once, and it has no setting for it — and that starved the specs
      # this repo relies on to prove a behaviour. On develop and on the next PR: KafkaSubscriberTest's
      # bound read 763 ms where it allows 700, AmqpConsumerTest's 10 s wait expired and its
      # concurrency scenario failed, JpaPluginTest's body did not finish within a minute. A bound
      # that proves a behaviour is not loosened to buy speed, so the loop it is. The bare run is
      # worth retrying only if the CLI gains a concurrency setting.
      #
      # The two harness timeouts raised for the bare run stay raised — ExchangeContextTest's
      # WebTestClient and RedisDependenciesTest's Ktor module-loading limit — since they prove
      # nothing either way.
      #
      # This is also what makes the step above load-bearing rather than an optimisation: each
      # invocation is a fresh JVM, so without the environment variables every one of these
      # fifty-seven would start its own Postgres, its own Mongo, its own RabbitMQ. Sharing them is
      # safe for data: every spec works in a namespace of its own — a schema, a database, a key
      # prefix, a queue or a bucket named through libs/core/stx-testing's TestNames, which carries a
      # per-JVM run id — and removes only that.
      #
      # The list is derived from the filesystem rather than written down, so a module that gains a
      # test tree is picked up by the change that adds it. Every module runs even after one fails:
      # "which of the fifty-seven" is the useful answer, and fail-fast gives the first one only.
      - name: Test, one module at a time
        run: |
          modules=$(find libs examples plugins server -type d \( -name test -o -name 'test@*' \) \
            -not -path '*/build/*' | sed 's|/test[^/]*$||' | xargs -n1 basename | sort -u)
          echo "$(echo "$modules" | wc -l) modules with tests"

          failed=""
          for m in $modules; do
            echo "::group::$m"
            ./kotlin test -m "$m" || failed="$failed $m"
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::error::tests failed in:$failed"
            exit 1
          fi

  lint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned, and the pin must match what CONTRIBUTING.md tells a contributor to install: two
      # ktlint versions disagree about formatting, and the disagreement surfaces as a CI failure
      # nobody can reproduce locally.
      - name: Install ktlint 1.8.0
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.8.0/ktlint
          chmod +x ktlint
      # `!build/**` is not optional: without it ktlint lints KSP and plugin output and reports
      # thousands of violations in files nobody edits.
      - run: ./ktlint --relative "**/*.kt" "!build/**"

  changeset:
    name: Changeset declared
    # The "Version Packages" pull request is exempt, and has to be: it rewrites
    # libs/**/package.json, libs/**/CHANGELOG.md and the family templates — so it touches libs/ by
    # definition — while *deleting* every changeset. Without this it would block itself forever.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Not "libs/ changed and no .changeset/*.md exists" any more. A version is now per family, so
      # a changeset naming the wrong family is worse than none: it releases a library nobody
      # touched and leaves the touched one behind. The guard maps the changed paths to families and
      # names the ones that are missing. scripts/changeset-guard.test.ts pins the wording.
      - name: A PR that changes a library must declare which family it releases
        env:
          BASE: ${{ github.base_ref }}
        run: bun scripts/changeset-guard.ts --base "origin/$BASE"

  scripts:
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      # bun strips types, it does not check them — so TypeScript under `bun scripts/*.ts` buys
      # nothing at all unless something runs tsc. This is that something, and it runs before the
      # tests because a type error is the cheaper failure to read.
      - run: bun run typecheck

      # scripts/sync-version.ts decides what version 45 modules publish under, in a job nobody
      # watches. It gets a test.
      - run: bun test scripts/

      # And the repository itself is checked, not just the script: every module wired to its
      # family's template, every family template chained to the shared one, and all 34 version
      # anchors agreeing with the families' package.json. A module wired to no family template
      # builds fine and only fails at `kotlin publish` — in the release job, after the version has
      # been bumped and a release is expected. This is that failure, moved to the pull request.
      - run: bun scripts/sync-version.ts --check

      # And the propagation graph, against the manifests that produce the POMs. A family's
      # package.json dependencies are what make a bump travel, they are written by hand, and a
      # missing edge is invisible: it builds, tests and publishes, and only stops releasing a
      # library whose POM names a version that moved.
      - run: bun scripts/graph.ts --check
