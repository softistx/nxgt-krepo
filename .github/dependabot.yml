version: 2
updates:
  # The Kotlin dependencies live in libs.versions.toml, which Dependabot cannot read: this is not a
  # Gradle project. `./kotlin show dependencies -m <module>` shows the upgrade arrows instead. The
  # release tooling's JavaScript dependencies are bumped by hand, deliberately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(ci)"
