version: 2
updates:
  # The Kotlin dependencies live in libs.versions.toml, which Dependabot cannot read: this is not a
  # Gradle project. `./kotlin show dependencies -m <module>` shows the upgrade arrows instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(ci)"
  # `bun`, not `npm`: the npm ecosystem rewrites package.json and leaves bun.lock behind, so every
  # PR it opened failed `bun install --frozen-lockfile` — all four of the first batch did.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "build"
